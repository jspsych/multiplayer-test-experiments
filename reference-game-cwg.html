    <link

  <body></body>
  <script>
    // ===============================================================================================
    // REFERENCE GAME — replication of Clark & Wilkes-Gibbs (1986), "Referring as a collaborative
    // process" (Cognition 22:1–39); the original full-board tangram arrangement task.
    //
    // Faithful design (from the paper), with ONE necessary web substitution:
    //   • 12 tangrams (the canonical set), 2 rows of 6. Director's board is the TARGET order; the
    //     matcher's is scrambled and must be rearranged to match.
    //   • FULL BOARD: every tangram is an ordered target; the director describes all 12 in order and
    //     the matcher reproduces that order, then submits for a score out of 12.
    //   • 6 trials, the same 12 figures re-randomized into a new target order each trial.
    //   • Director/matcher roles fixed for the whole game.
    //   • Free, UNRESTRICTED, bidirectional communication — the original was SPOKEN dialogue behind an
    //     opaque screen; on the web we substitute unrestricted two-way TEXT CHAT. This modality swap is
    //     the one unavoidable DESIGN deviation from 1986 and is noted as such in the paper. (Both may
    //     send, no count/length limit — reference shortening only holds if the matcher can talk back.)
    //   • After each trial, feedback reveals the correct order to both (original: mismatches reported).
    //
    // The other departure is not a design choice: `round_timeout` (180s) has no counterpart in the
    // original, which ran untimed. It was added so a disconnected or absent partner cannot hang the
    // trial forever — but note what it actually is: an UNCONDITIONAL wall-clock bound armed when the
    // round starts, which ends EVERY round at 180s whether or not anyone has dropped. It cannot tell
    // a dead partner from a slow one. Rounds it ends are recorded as `ended_by: "timeout"` with a null
    // assignment — filter on that when analysing. Watch it in piloting: trial 1 of a 12-figure board is
    // the longest in the study, and a cap that truncates it would bite exactly where the effect is
    // largest.
    //
    // Key replication DVs (logged per round): message_count / messages_sent (the words-per-figure
    // effect: 41→8 across trials 1→6 in the original), accuracy / n_correct (original error rate 2%).
    // ===============================================================================================

    const MIN_PLAYERS = 2;
    const N = 12; // full board of 12 tangrams
    // Faithful is 6 trials. Lower for a quick two-tab smoke test, then restore to 6.
    const TRIALS = 6;

    // ===============================================================================================
    // RUN CONFIG — every value that has to agree with the Prolific study configuration.
    //
    // Deliberately one block, because these are decisions rather than code, and several of them
    // CANNOT BE CHANGED once a Prolific study is published (the reward, the screen-out reward, the
    // advertised duration). Keeping them in one place is what makes them reviewable and what keeps
    // participant-facing copy from drifting away from what is actually configured.
    //
    // See DECISIONS.md (group B, "locked at publish") and the launch checklist there.
    // ===============================================================================================
    const CONFIG = {
      // --- Prolific completion codes. Created with the study; paste them here. -------------------
      // FOUR codes, not one: every exit has to be separately reconcilable, and three of the four are
      // paths where the participant did NOT finish but must still be paid.
      COMPLETION_CODES: {
        complete: "", // TODO(#7): finished the game
        partner_dropped: "", // TODO(#7): survivor of a dropout (#5)
        no_match: "", // TODO(#7): lobby timeout or spectator overflow (#6)
        screened_out: "", // TODO(#7): failed the exposure item or declined the commitment gate (#13)
      },

      // --- Timing -------------------------------------------------------------------------------
      // NOT in the original C&WG design. An UNCONDITIONAL wall-clock bound on every round, armed when
      // the round starts — not a dropout detector. It ends a round at this value whether the partner
      // is gone, slow, or simply thinking, and it is why #5 has to infer dropout from consecutive
      // timeouts rather than read it off this. Watch it in piloting: trial 1 of a 12-figure board is
      // the longest in the study, and a cap that truncates it would bite exactly where the effect is
      // largest.
      ROUND_TIMEOUT_MS: 180000,

      // --- Data ---------------------------------------------------------------------------------
      // TODO(#15): DataPipe experiment ID, from the experiment dashboard. The egress layer below is
      // built and tested, but SAVING IS INERT UNTIL THIS IS SET — it warns rather than posting, which
      // is safer than a placeholder that uploads to an unintended project. Until it is filled in,
      // every participant who does not click the download button contributes nothing.
      DATAPIPE_EXPERIMENT_ID: "",

      // --- Dropout detection (#5) ---------------------------------------------------------------
      // Consecutive SILENT rounds before concluding the partner is gone. A round counts as silent
      // only if it timed out AND the partner sent no chat message during it — see the detector for
      // why both conditions are needed. Two is the suggested value: at a 180s round that is ~6
      // minutes of dead time before the survivor is released, against 15 minutes today, while still
      // requiring corroboration rather than firing on a single slow round.
      //
      // The trade is asymmetric, and NOT in the direction it first looks. A false negative leaves a
      // survivor grinding; a false positive ends a live game for BOTH participants and pays two
      // partial codes — the same cost as the dropout this is guarding against, inflicted on a dyad
      // that was working. Requiring partner silence is what makes 2 tolerable: a slow dyad that is
      // still talking is never aborted.
      //
      // The known false-positive channel, stated plainly because the guard above does not close it:
      // silence is not absence. A matcher can be actively working — clicking slots, placing 12
      // tangrams — and typing nothing, and `save_interaction_history` is matcher-local until submit,
      // so from the director's side that is byte-identical to a partner who has gone. Two slow first
      // rounds on a full board is not far-fetched, and it is exactly where the effect is largest.
      //
      // Pilot check (#12): if `partner_dropped` rows cluster at `n_trials_completed` 0-1, that is
      // this false positive, not a real dropout rate. The fix then is a POSITIVE-EVIDENCE signal —
      // surfacing the matcher's slot activity into the shared session, which needs a channel the
      // bundles do not currently expose (#11) — and NOT raising this number. A higher threshold buys
      // safety with dead minutes and does not resolve the ambiguity: an active silent matcher looks
      // absent at 3 rounds too, just later. That is the same trade the detector already refuses when
      // it declines to count bare timeouts.
      DROPOUT_SILENT_ROUNDS: 2,

      // A4 — save per-round chunks rather than once at the end. A single end-of-run save loses
      // everything for any dyad that breaks, which is exactly the population #12 needs to
      // characterise. Assumes `limitSessions` is OFF (B4): DataPipe's counter increments per SAVE
      // CALL, so per-round saving spends ~7 sessions per participant, and a limit sized to
      // participants would cap the run a seventh of the way through and drop later saves silently.
      SAVE_PER_ROUND: true,

      // A3 — the abort path flushes unconditionally. The one irreversible decision in the register:
      // unflushed rows are gone forever, flushed rows can always be ignored in analysis.
      FLUSH_ON_ABORT: true,

      // Retry policy. Only transient faults are retried — see classify() for why 202 and 4xx must
      // not be, which is not obvious and was checked against DataPipe's source.
      SAVE_MAX_ATTEMPTS: 3,
      SAVE_BASE_BACKOFF_MS: 500,

      // A save must never hold up a redirect to Prolific (#5, #7). An unpaid participant is a worse
      // outcome than a late chunk — and the chunk usually is not lost, since DataPipe queues its own
      // retry server-side.
      SAVE_REDIRECT_BUDGET_MS: 3000,

      // Where the study is hosted, for the Prolific redirect. Kept here so it is obvious that the
      // production value has to be a real https URL, not a file:// path.
      PROLIFIC_SUBMIT_URL: "https://app.prolific.com/submissions/complete",
    };

    const jsPsych = initJsPsych();
    const localAdapter = new jsPsychAdapterMultiplayerLocal({ persistParticipant: true });

    const SHAPES = Tangrams.STIMULI; // 12 canonical tangrams
    // Seed the schedule from the SHARED SESSION ID, so each dyad gets its own target orders while the
    // two partners still agree on them. A fixed seed would hand every dyad the identical orders,
    // confounding item order with trial number — the very axis this study measures.
    //
    // Read AFTER the adapter is constructed, deliberately: on the first tab there is no `?mp_session=`
    // yet, and the LocalAdapter constructor is what generates one and writes it into the URL. The
    // second tab arrives with it already in the pasted link, so both compute the same schedule.
    // Swapping to the Firebase adapter: seed from whatever identifies the dyad there (e.g. the room
    // id) — the requirement is only that both partners derive the same value.
    const SEED = new URLSearchParams(location.search).get("mp_session") ?? "cwg-fullboard";
    // 6 trials, each a fresh random order of all 12. Deterministic given the seed, so both tabs agree
    // without exchanging anything.
    const SCHEDULE = Tangrams.fullBoardSchedule(TRIALS, SEED);

    // ===============================================================================================
    // PROLIFIC IDENTIFIERS AND PROVENANCE (#4)
    //
    // Prolific requires that identifiers be recorded so paired responses can be linked, and without
    // them collected data cannot be reconciled against submissions in order to approve payment.
    // ===============================================================================================

    // Prolific appends these to the study URL. Read from the ORIGINAL query string, which is safe:
    // the LocalAdapter's replaceState preserves existing params when it adds ?mp_session=.
    const prolificParams = new URLSearchParams(location.search);
    const PROLIFIC_PID = prolificParams.get("PROLIFIC_PID");
    const STUDY_ID = prolificParams.get("STUDY_ID");
    const SESSION_ID = prolificParams.get("SESSION_ID");

    // The dyad identifier. Read from the same source as SEED and for the same reason: it is the one
    // value both partners share. Note the coupling — whatever fixes SEED for Firebase (#9) has to fix
    // this in the same change, or rows will carry a dyad id that does not identify a dyad.
    //
    // Falls back to the SAME literal SEED uses, deliberately. A null here would put `dyad_id: null` on
    // every row while the save filenames (#3) fall back to SEED, producing files named after a dyad
    // whose rows claim not to belong to one — self-inconsistent data that still LOOKS reconcilable,
    // which is worse than either failure alone. The fallback makes it consistent; the warning below
    // makes it loud, because a constant dyad id shared across all dyads is still wrong.
    const DYAD_ID = prolificParams.get("mp_session") ?? "cwg-fullboard";

    // Attach to EVERY row. Analysis here is entirely dyad-level, so a row that cannot be traced to a
    // pair is not analysable; and a row that cannot be traced to a PROLIFIC_PID cannot be paid for.
    jsPsych.data.addProperties({
      prolific_pid: PROLIFIC_PID,
      study_id: STUDY_ID,
      session_id: SESSION_ID,
      dyad_id: DYAD_ID,
      // Own participant id, so the two sides of a dyad are distinguishable within it.
      participant_id: localAdapter.participantId ?? null,
      // Run provenance — needed to interpret data collected while piloting at different values.
      experiment_file: "reference-game-cwg.html",
      config_trials: TRIALS,
      config_n_stimuli: N,
      config_round_timeout_ms: CONFIG.ROUND_TIMEOUT_MS,
      // A 6×2 tangram grid on a small screen is a different task. Captured so that can be checked
      // rather than assumed, and so a mobile block (#13) can be verified to have worked.
      viewport_w: window.innerWidth,
      viewport_h: window.innerHeight,
      screen_w: window.screen?.width ?? null,
      screen_h: window.screen?.height ?? null,
      user_agent: navigator.userAgent,
    });

    // ===============================================================================================
    // PROLIFIC SUBMISSION (#7)
    //
    // Without this NO participant can submit at all, including one who plays the whole game. Built as
    // standalone helpers rather than inline in the final screen, because #5 and #6 both need to exit
    // from paths that never reach `doneTrial`.
    // ===============================================================================================

    // The code is always shown as selectable text alongside the button. If the redirect is blocked —
    // popup blocker, embedded webview, flaky network — a visible code still lets the participant
    // submit manually. A stranded participant with no code is the failure this whole issue exists to
    // remove, so it should not be reintroduced by trusting `location.href` to work.
    function submissionBlockHTML(codeKey) {
      const code = CONFIG.COMPLETION_CODES[codeKey];
      if (!code) {
        // Give an actionable route, not just an apology. Prolific participants can message the
        // researcher from the study page, and telling them so is the difference between a resolved
        // submission and an unpaid one. "Do not close this tab" alone strands exactly the person this
        // whole issue exists to protect.
        return `<p style="color:#b00"><strong>Something has gone wrong on our end.</strong> Your
                responses have been recorded, but the completion code for this exit
                (<code>${codeKey}</code>) is missing, so the automatic submission cannot run.</p>
                <p style="color:#b00">Please <strong>message the researcher from this study's page on
                Prolific</strong> and quote <code style="user-select:all">${codeKey}</code>. You will be
                paid — do not return the study. Please keep this tab open until you have sent it.</p>`;
      }
      return `<p><button id="prolific-submit" type="button">Submit and return to Prolific</button></p>
              <p style="font-size:0.9em">If that button does not work, your completion code is
              <code style="user-select:all">${code}</code> — paste it into Prolific to submit.</p>`;
    }

    function redirectToProlific(codeKey) {
      const code = CONFIG.COMPLETION_CODES[codeKey];
      if (!code) {
        console.error(`No Prolific completion code configured for "${codeKey}".`);
        return;
      }
      window.location.href = `${CONFIG.PROLIFIC_SUBMIT_URL}?cc=${encodeURIComponent(code)}`;
    }

    function wireSubmissionButton(codeKey) {
      document
        .getElementById("prolific-submit")
        ?.addEventListener("click", () => redirectToProlific(codeKey));
    }

    // Fail loudly at startup rather than at the moment a participant tries to submit. Unset codes are
    // the kind of thing that looks fine in a two-tab smoke test and strands a paid participant later.
    (function warnOnUnsetConfig() {
      const unset = Object.entries(CONFIG.COMPLETION_CODES)
        .filter(([, v]) => !v)
        .map(([k]) => k);
      if (unset.length) {
        console.warn(
          `[config] Completion codes not set: ${unset.join(", ")}. ` +
            `Participants reaching those exits will not be able to submit.`
        );
      }
      if (!CONFIG.DATAPIPE_EXPERIMENT_ID) {
        console.warn(
          "[config] No DATAPIPE_EXPERIMENT_ID (#15). Data egress is wired but INERT — nothing will " +
            "be uploaded, so every participant who does not click the download button contributes nothing."
        );
      }
      if (!PROLIFIC_PID) {
        console.warn("[config] No PROLIFIC_PID in the URL. Expected when testing locally.");
      }
      // The highest-severity config fault, and the quietest. Every DV here is dyad-level, so rows that
      // all share one fallback dyad id are not merely mislabelled — they collapse every pair into a
      // single apparent dyad, which analysis cannot detect and cannot undo. Under Firebase (#9) this
      // is the DEFAULT state until SEED and DYAD_ID are re-derived from the room id, so it must be
      // impossible to miss.
      if (!prolificParams.get("mp_session")) {
        console.error(
          `[config] No ?mp_session= in the URL — dyad_id fell back to "${DYAD_ID}". Every row will ` +
            `carry the SAME dyad id, so partners cannot be paired and no dyad-level analysis is ` +
            `possible. Expected on a first tab before the adapter writes the param; NOT expected once ` +
            `a partner has joined, and never acceptable in collected data (#9).`
        );
      }
    })();

    // ===============================================================================================
    // DATA EGRESS (#3) — DataPipe → OSF, incremental per-round saves
    //
    // Written against DataPipe's server source (jspsych/datapipe, functions/src/api-data.ts) rather
    // than the plugin's example snippet, because the response semantics are genuinely counterintuitive
    // and determine whether retrying is correct or actively harmful:
    //
    //   201  Created  — uploaded to OSF.
    //   202  Accepted — the OSF upload FAILED, but DataPipe persisted the data and queued it for its
    //                   own server-side retry. This is a SUCCESS for us; retrying would duplicate rows.
    //   400  OSF_FILE_EXISTS — filename collided. NOT queued for retry; the one path where data is
    //                   genuinely dropped. Hence the nonce in every filename (A4).
    //   400  SESSION_LIMIT_REACHED / INVALID_DATA / EXPERIMENT_NOT_FOUND / PROVIDER_NOT_CONNECTED —
    //                   configuration errors, not transient faults. Retrying burns the redirect
    //                   budget and still loses the data; the fix is on the dashboard (B4).
    //   5xx / 429 / network — genuinely transient. The only ones worth retrying.
    //
    // Classification keys on the STATUS CLASS, not on error strings, so an upstream change that adds
    // a new 4xx (the in-flight provider-migration branch adds PROVIDER_NOT_CONNECTED) is handled
    // correctly without a change here.
    // ===============================================================================================
    const DATAPIPE_ENDPOINT = "https://pipe.jspsych.org/api/data/";

    const Pipeline = (() => {
      // High-water mark: every row before this index has been CLAIMED by some save. It only ever
      // advances. Rows from a save that failed are tracked separately, in `pending`, rather than by
      // winding this back.
      //
      // Winding it back is the obvious implementation and it is WRONG, because saves do not fail in
      // the order they were issued. Subtracting a count from a shared cursor is only correct if the
      // failing save is the most recent claimant; when an earlier save fails after a later one has
      // already claimed rows, the cursor lands short, permanently dropping the earliest rows while
      // re-sending the later ones. That is not exotic — the per-round save is not awaited and can
      // retry for seconds, so a slow round-6 save overlapping the end-of-run flush is the ordinary
      // end of a session. It also fails SILENTLY, because the overlapping row ranges it produces are
      // exactly what breaks the contiguity check that would otherwise catch it.
      let savedThrough = 0;
      // Ranges [start, end] (inclusive) from saves that failed, awaiting a later attempt. The next
      // save takes these along with any new rows, so nothing is stranded and nothing is duplicated.
      let pending = [];
      let chunkSeq = 0;
      const log = [];

      // Defensive only: DYAD_ID now carries the same fallback SEED does, so this cannot currently be
      // reached. Kept because a filename containing the literal "null" is unrecoverable in a way a
      // redundant `??` is not — but it is NOT load-bearing, and the fix belongs at DYAD_ID.
      const dyadKey = () => DYAD_ID ?? SEED;

      // Deliberately NOT the Prolific PID. OSF file listings are browsable without opening any file,
      // so a PID in a filename publishes a directory of participant identifiers — a different and
      // broader exposure than the same value sitting inside a saved row. Reconciliation still works,
      // because the payload carries the PID. See D3/D6 in DECISIONS.md, both open with IRB.
      const participantKey = () => localAdapter?.participantId ?? "anon";

      const configured = () => !!CONFIG.DATAPIPE_EXPERIMENT_ID;

      // Fresh per SAVE, never per attempt and never derived from the round number. Two distinct saves
      // must not collide (OSF answers a duplicate with 409, the one unrecoverable failure); the
      // retries WITHIN one save must collide, which is what makes them idempotent — see the replay
      // case in post().
      const nonce = () =>
        `${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 8)}`;

      function classify(status) {
        // Any 2xx is success. DataPipe currently answers 201 or 202, but treating an unexpected 200
        // as a failure would requeue rows that did land and duplicate them — the failure mode this
        // module works hardest to avoid, caused by nothing worse than an upstream tightening.
        if (status >= 200 && status < 300) return "ok";
        if (status === 429 || status >= 500) return "retry";
        return "terminal";
      }

      async function post(filename, payload) {
        let lastDetail = null;

        for (let attempt = 1; attempt <= CONFIG.SAVE_MAX_ATTEMPTS; attempt++) {
          try {
            const response = await fetch(DATAPIPE_ENDPOINT, {
              method: "POST",
              headers: { "Content-Type": "application/json", Accept: "*/*" },
              // keepalive lets an in-flight save survive the page navigating to Prolific. Capped at
              // 64KB by spec, which per-round chunks stay well under — another reason A4's chunking
              // is load-bearing rather than merely tidy.
              keepalive: true,
              body: JSON.stringify({
                experimentID: CONFIG.DATAPIPE_EXPERIMENT_ID,
                filename,
                data: payload,
              }),
            });

            const verdict = classify(response.status);
            if (verdict === "ok") return { ok: true, status: response.status, attempt };

            const body = await response.json().catch(() => ({}));
            lastDetail = { status: response.status, error: body.error ?? null };

            // Idempotent replay. Every attempt here posts the SAME filename, so a collision on a
            // RETRY means our own earlier attempt did land at OSF and only its response was lost.
            // Treating that as failure would requeue the rows and re-send them under a fresh nonce,
            // duplicating them — the exact outcome the nonce exists to prevent. A collision on the
            // FIRST attempt is a genuine clash with another session and stays terminal.
            if (body.error === "OSF_FILE_EXISTS" && attempt > 1) {
              console.warn(`[pipeline] ${filename} already landed on an earlier attempt; treating as saved.`);
              return { ok: true, status: response.status, attempt, replayed: true };
            }

            if (verdict === "terminal") {
              console.error(`[pipeline] ${filename} rejected (terminal):`, lastDetail);
              return { ok: false, ...lastDetail, attempt };
            }

            const retryAfter = Number(response.headers.get("Retry-After"));
            const backoff =
              Number.isFinite(retryAfter) && retryAfter > 0
                ? retryAfter * 1000
                : CONFIG.SAVE_BASE_BACKOFF_MS * 2 ** (attempt - 1);
            await new Promise((r) => setTimeout(r, backoff));
          } catch (e) {
            // Network fault — indistinguishable from a 5xx here, and treated the same.
            lastDetail = { status: null, error: String(e) };
            await new Promise((r) =>
              setTimeout(r, CONFIG.SAVE_BASE_BACKOFF_MS * 2 ** (attempt - 1))
            );
          }
        }

        console.error(`[pipeline] ${filename} exhausted retries:`, lastDetail);
        return { ok: false, ...lastDetail, attempt: CONFIG.SAVE_MAX_ATTEMPTS };
      }

      // `label` names the exit path, so a chunk's provenance is legible from its filename alone:
      // round-3, abort-partner-dropped, no-match, complete.
      async function save(label) {
        if (!configured()) {
          console.warn(`[pipeline] No DATAPIPE_EXPERIMENT_ID — "${label}" NOT saved (#3).`);
          return { ok: false, skipped: true };
        }

        const all = jsPsych.data.get().values();

        // Claim BEFORE any await, so a save triggered while this one is in flight (a round completing
        // during the end-of-run flush) cannot send the same rows twice. Two things are claimed: every
        // range left over from an earlier failure, and everything new since the high-water mark.
        const inherited = pending;
        pending = [];
        const ranges = [...inherited];
        if (all.length > savedThrough) ranges.push([savedThrough, all.length - 1]);
        savedThrough = Math.max(savedThrough, all.length);

        const rows = ranges.flatMap(([start, end]) => all.slice(start, end + 1));
        if (rows.length === 0) return { ok: true, empty: true };

        const seq = chunkSeq++;
        const filename = `cwg_${dyadKey()}_${participantKey()}_${String(seq).padStart(
          2,
          "0"
        )}-${label}_${nonce()}.json`;

        const result = await post(
          filename,
          JSON.stringify({
            dyad_id: dyadKey(),
            participant_id: participantKey(),
            // The Prolific id lives here, in the payload, and NOT in the filename — see
            // participantKey(). Reconciliation reads it from here.
            prolific_pid: PROLIFIC_PID,
            chunk_seq: seq,
            chunk_label: label,
            // A LIST of inclusive ranges, not a single pair: a chunk may carry rows reclaimed from an
            // earlier failed save alongside new ones, and those are not contiguous with each other.
            row_ranges: ranges,
            saved_at: new Date().toISOString(),
            trials: rows,
          })
        );

        if (!result.ok && !result.skipped) {
          // Hand the ranges back for a later save to retry. Merged with anything another save queued
          // while this one was in flight, and re-sorted so chunks stay readable in order. The
          // end-of-run flush is then the safety net for every earlier failure, at the cost of
          // re-sending some rows under a new filename — duplicates are recoverable in analysis,
          // missing rows are not.
          pending = [...ranges, ...pending].sort((a, b) => a[0] - b[0]);
        }

        log.push({ filename, label, rows: rows.length, ...result });
        return result;
      }

      // Flush for exit paths (A3). Resolves when the save finishes OR when the redirect budget
      // expires, whichever comes first — a participant must never be held on a spinner waiting for
      // OSF before they can submit (#7).
      function flush(label) {
        return Promise.race([
          save(label),
          new Promise((r) =>
            setTimeout(() => r({ ok: false, timedOut: true }), CONFIG.SAVE_REDIRECT_BUDGET_MS)
          ),
        ]);
      }

      return { save, flush, log: () => log, configured };
    })();

    // Last-ditch flush for exits we cannot intercept: tab close, browser back, connection loss.
    // `pagehide` fires where `beforeunload` does not (bfcache, mobile Safari), and the save uses
    // keepalive so it survives the page going away. Unconditional, per A3.
    window.addEventListener("pagehide", () => {
      if (CONFIG.FLUSH_ON_ABORT) Pipeline.save("unload");
    });

    // The 12 tangrams are real PNGs, and `rt` is a reported DV — without this the first exposure to
    // each image loads mid-trial. `stimuli` is an OBJECT parameter, so jsPsych's automatic media
    // preloading cannot discover the `src` values; they have to be listed explicitly.
    const preloadTrial = {
      type: jsPsychPreload,
      images: SHAPES.map((s) => s.src),
      message: "<p>Loading…</p>",
    };

    let myName = "";
    let myRole;
    let partnerId;

    // ===============================================================================================
    // DROPOUT DETECTION (#5)
    //
    // There is no presence API in any of the four bundles, so the partner's absence has to be
    // inferred. The inference has to be good, because acting on it ends a paid session.
    //
    // `round_timeout` alone is NOT the signal. It is a wall-clock bound (see CONFIG), so it fires
    // identically for a partner who left and a pair who are simply slow — and trial 1 of a 12-figure
    // board is the longest in the study, so a genuine timeout there is entirely normal. Counting
    // timeouts alone would abort real dyads at exactly the point the effect is largest.
    //
    // So a round is "silent" only if it timed out AND the partner sent nothing during it. The plugin
    // records `message_count` (every message that round) and `messages_sent` (mine), and the chat
    // channel is per-round, so the difference is the partner's activity in that round alone. A
    // partner who is talking is present, however slow they are.
    //
    // TWO CONFIG DEPENDENCIES, both currently satisfied by defaults and both silent if broken. There
    // are tests for each in tests/dropout.test.mjs, because neither fails loudly at runtime:
    //
    //   1. `chat_persists` must stay OFF. The plugin keys the chat channel `<session>_chat_r<round>`
    //      when it is off and `<session>_chat` when it is on, so turning it on makes `message_count`
    //      CUMULATIVE: `partnerMessages` never returns to zero, the detector never fires again, and
    //      the survivor grinds — the exact failure this exists to prevent, arrived at silently.
    //   2. `ended_by: "timeout"` is only equivalent to "the round clock ran out" because
    //      `selection_timeout` is unset. The plugin emits the same string for a selection timeout,
    //      which is a different event with a possibly-present partner.
    //
    // Upgrade path: when a presence API exists (#11), this becomes a fallback rather than the
    // primary signal. It does not need to wait for one. See CONFIG for the false-positive channel
    // this cannot close — an active but silent matcher — and what to do if the pilot shows it.
    // ===============================================================================================
    let consecutiveSilentRounds = 0;
    let partnerDropped = false;
    let dropoutRound = null;

    // Trials the dyad actually completed, as opposed to rounds the timeline advanced through. Only
    // `ended_by: "submit"` counts — a timed-out round has a null assignment and is not a trial.
    // This is what makes a partial dyad usable rather than merely present (#8).
    const completedTrials = () =>
      jsPsych.data
        .get()
        .filter({ trial_type: "multiplayer-reference-game", ended_by: "submit" })
        .count();

    // Session-level facts, stamped onto every row at the point the game ends by any route. Recorded
    // here rather than left to analysis because "how did this session end" cannot be reconstructed
    // reliably from partial data — which is precisely the data most likely to be all we have.
    //
    // First writer wins. `addProperties` applies retroactively to every row already collected, so a
    // second call would not merely add a row — it would rewrite the FIRST outcome on every existing
    // row and destroy the reason the session actually ended. Exactly one outcome is recorded per
    // session today; this makes that structural rather than a property of the current routing.
    let endedReason = null;
    function recordOutcome(reason) {
      if (endedReason) return;
      endedReason = reason;
      jsPsych.data.addProperties({
        ended_reason: reason,
        n_trials_completed: completedTrials(),
        n_trials_scheduled: TRIALS,
        dropout_detected_at_round: dropoutRound,
      });
    }

    const nameTrial = {
      type: jsPsychSurveyText,
      questions: [{ prompt: "Choose a display name:", required: true, name: "name" }],
      on_finish: (data) => {
        myName = (data.response.name || "").trim() || "Anonymous";
      },
    };

    const lobbyTrial = {
      type: jsPsychMultiplayerSync,
      push_data: () => ({ name: myName, joinedAt: Date.now() }),
      message: `<p>Waiting for ${MIN_PLAYERS} players to join…</p>
                <p>Open this page in another tab (keep the <code>?mp_session=</code> in the URL) to add a player.</p>`,
      wait_for: (group) =>
        Object.values(group).filter((entry) => entry && entry.name).length >= MIN_PLAYERS,
    };

    const roleTrial = {
      type: jsPsychMultiplayerRole,
      roles: ["director", "matcher"],
      strategy: "random",
      overflow_role: "spectator",
      ready: (group) =>
        Object.keys(group).length >= MIN_PLAYERS &&
        Object.values(group).every((entry) => entry && entry.joinedAt != null),
      save_group: true,
      message: "<p>Pairing you with your partner…</p>",
      on_finish: () => {
        myRole = jsPsychMultiplayerRole.getMyRole();
        const byRole = jsPsychMultiplayerRole.participantsByRole();
        partnerId = myRole === "director" ? byRole.matcher?.[0] : byRole.director?.[0];
      },
    };

    const spectatorScreen = {
      timeline: [
        {
          type: jsPsychHtmlKeyboardResponse,
          stimulus: "<p>This game is already full. Thanks for your interest!</p>",
          choices: "NO_KEYS",
          trial_duration: 4000,
          on_finish: () => {
            // Flush even here. A spectator has no game data, but their arrival and the fact they were
            // turned away is the raw material for the odd-arrival rate #10's waiting room must handle.
            recordOutcome("spectator");
            if (CONFIG.FLUSH_ON_ABORT) Pipeline.flush("spectator");
            jsPsych.multiplayer.disconnect();
          },
        },
      ],
      conditional_function: () => myRole === "spectator",
    };

    const gameRound = {
      type: jsPsychMultiplayerReferenceGame,
      stimuli: SHAPES,
      columns: 6, // 2 rows of 6, as in the original
      role: () => jsPsychMultiplayerRole.getMyRole(),
      partner_id: () => partnerId,
      round: jsPsych.timelineVariable("round"),
      targets: jsPsych.timelineVariable("targets"), // all 12 ids, ordered → full-board match
      ordered: true,
      scramble_mode: "independent",
      reveal_target_to: "director", // only the director sees the target order
      // Unrestricted two-way text chat (web substitute for the original spoken dialogue).
      chat_role: "both",
      max_messages: null,
      max_length: null,
      submit_label: "Submit board",
      show_running_score: true,
      // Full ordered log of the matcher's pre-submit actions ({ t, action, slot, object_id }, matcher
      // only, local until submit). A superset: per shape you can recover both first placement ("clicked")
      // and final placement, plus every reassign/clear — grounding latency, placement-vs-description
      // order, revision behavior. The core word-count DV doesn't need it, but it's ~free and matches
      // the Hawkins file.
      save_interaction_history: true,
      round_timeout: CONFIG.ROUND_TIMEOUT_MS, // NOT in the original — see CONFIG and the header
      // A4 — flush after every round rather than once at the end. A dyad that breaks in round 4 is
      // exactly the case #12 needs data from, and an end-of-run-only save is the shape that loses it.
      // Deliberately not awaited: the next round must not wait on OSF.
      on_finish: (data) => {
        if (CONFIG.SAVE_PER_ROUND) Pipeline.save(`round-${data.round ?? "?"}`);

        // Partner activity in THIS round. `message_count` is every message on the round's channel
        // and `messages_sent` is mine, so the difference is theirs. A round that timed out while the
        // partner was still talking is a slow round, not a dropout.
        const partnerMessages = (data.message_count ?? 0) - (data.messages_sent ?? 0);
        const silent = data.ended_by === "timeout" && partnerMessages <= 0;
        consecutiveSilentRounds = silent ? consecutiveSilentRounds + 1 : 0;

        if (!partnerDropped && consecutiveSilentRounds >= CONFIG.DROPOUT_SILENT_ROUNDS) {
          partnerDropped = true;
          dropoutRound = data.round ?? null;
          recordOutcome("partner_dropped");
          // `conditional_function` on gameLoop is evaluated ONCE, before the first round, so it
          // cannot end the loop mid-game. Aborting the enclosing timeline from here is what actually
          // stops the remaining rounds; execution resumes at the screens after gameLoop.
          jsPsych.abortCurrentTimeline();
        }
      },
      prompt: (role) =>
        role === "director"
          ? "<p><strong>You are the Director.</strong> Describe your tangrams in badge order (1, 2, 3, …) so your partner can arrange theirs the same way. You can talk back and forth as much as you need.</p>"
          : "<p><strong>You are the Matcher.</strong> For each numbered slot, click the slot and then the tangram your partner says goes there. Fill every slot, then submit.</p>",
    };

    const gameLoop = {
      timeline: [gameRound],
      timeline_variables: SCHEDULE,
      conditional_function: () => myRole === "director" || myRole === "matcher",
    };

    // The survivor's exit (#5). Honest about what happened, explicit that they are still paid, and
    // it never blames them. This screen is the entire difference between a survivor who submits and
    // one who abandons and opens a support ticket.
    const partnerDroppedScreen = {
      timeline: [
        {
          type: jsPsychHtmlKeyboardResponse,
          stimulus: () => {
            const played = completedTrials();
            return `<h2>Your partner seems to have disconnected</h2>
                <p>We waited, but your partner stopped responding, so we have ended the study here.
                   <strong>This is not your fault, and your payment is not affected.</strong></p>
                <p>You completed ${played} of ${TRIALS} round${played === 1 ? "" : "s"} together, and
                   ${played > 0 ? "that work is saved and still useful to us" : "your time is still paid"}.</p>
                <p id="save-status" style="font-size:0.9em;color:#666">Saving your responses…</p>
                ${submissionBlockHTML("partner_dropped")}`;
          },
          choices: "NO_KEYS",
          on_load: () => {
            // Wire the button FIRST. The participant must be able to submit immediately, whatever
            // the save is doing — the whole point of this screen is that they get paid.
            wireSubmissionButton("partner_dropped");
            jsPsych.multiplayer.disconnect();
            Pipeline.flush("abort-partner-dropped").then((r) => {
              const el = document.getElementById("save-status");
              if (!el) return;
              el.textContent = r.skipped
                ? ""
                : r.ok
                ? "Your responses have been saved."
                : r.timedOut
                ? "Still uploading — you can submit now, this will finish in the background."
                : "Your responses could not be uploaded. Please submit anyway and message the researcher.";
            });
          },
        },
      ],
      conditional_function: () => partnerDropped,
    };

    const doneTrial = {
      type: jsPsychHtmlKeyboardResponse,
      stimulus: () => {
        const completed = jsPsych.data
          .get()
          .filter({ trial_type: "multiplayer-reference-game", ended_by: "submit" });
        const played = completed.count();
        const total = completed.select("n_correct").sum();
        return `<h2>Game complete!</h2>
                <p>Together you scored <strong>${total} / ${played * N}</strong> across ${played} trial${
          played === 1 ? "" : "s"
        }.</p>
                <p>Thank you — please submit to complete the study.</p>
                <p id="save-status" style="font-size:0.9em;color:#666">Saving your responses…</p>
                ${submissionBlockHTML("complete")}
                <p style="font-size:0.85em;color:#666">
                  Researcher tools: <button id="dl" type="button">Download data (JSON)</button>
                </p>`;
      },
      choices: "NO_KEYS",
      on_load: () => {
        wireSubmissionButton("complete");
        recordOutcome("complete");

        // Final flush: the last round's rows, plus anything an earlier chunk failed to send. Fired
        // on_load rather than on_finish because this trial takes no keys and never finishes — the
        // participant leaves via the submit button. Not awaited before wiring that button: the
        // redirect must stay available immediately even if OSF is slow or down (#7).
        Pipeline.flush("complete").then((r) => {
          const el = document.getElementById("save-status");
          if (!el) return;
          // Do not promise a retry that may not happen. A 202 IS retried, by DataPipe, server-side.
          // A flush that merely ran out of redirect budget may be a dead network, where nothing
          // retries — so that case gets wording that is true either way rather than a reassurance
          // that might be false.
          el.textContent = r.skipped
            ? "" // no egress configured yet (#15) — say nothing rather than something false
            : r.ok
            ? "Your responses have been saved."
            : r.timedOut
            ? "Still uploading — you can submit now, this will finish in the background."
            : "Your responses could not be uploaded. Please submit anyway and message the researcher.";
        });

        // Retained as a researcher fallback. Now that DataPipe is wired this is a debugging
        // convenience rather than the only egress — it is NOT something a participant is relied
        // upon to click.
        document
          .getElementById("dl")
          ?.addEventListener("click", () =>
            jsPsych.data.get().localSave("json", "reference-game-cwg-data.json")
          );
      },
    };

    // `doneTrial` used to run unconditionally, which meant two people who never finished the game
    // still reached "Game complete!" and were handed the `complete` code: the survivor of a dropout,
    // and — already, before this change — any spectator, who saw a 4-second "game is full" screen and
    // then a completion screen reporting 0 / 0. Both are paid under the wrong code, which defeats the
    // point of having four, and the spectator case also contradicts what the screen before it said.
    const completeScreen = {
      timeline: [doneTrial],
      conditional_function: () =>
        !partnerDropped && (myRole === "director" || myRole === "matcher"),
    };

    jsPsych.multiplayer.connect(localAdapter).then(() => {
      // Preload FIRST, before pairing: a participant who is still fetching images while their
      // partner waits in the lobby wastes the partner's time.
      jsPsych.run([
        preloadTrial,
        nameTrial,
        lobbyTrial,
        roleTrial,
        spectatorScreen,
        gameLoop,
        // Exactly one of these two runs, and each carries its own completion code. gameLoop's own
        // conditional cannot end it mid-game, so the abort comes from inside the round (#5).
        partnerDroppedScreen,
        completeScreen,
      ]);
    });
  </script>
</html>
