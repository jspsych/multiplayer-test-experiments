<!DOCTYPE html>
<html>
  <head>
    <title>Reference Game — Hawkins et al. 2020 replication (sequential) — jsPsych multiplayer</title>
    <!-- jsPsych core MUST carry the multiplayer API (jsPsych#3694). SHA-pinned to the #3694 preview
         build (see examples/README.md "Running it" to re-pin). -->
    <script src="https://cdn.jsdelivr.net/gh/jspsych/jsPsych@151ab520542a8e48bcc4d5b21c74cdffae8b48c6/packages/jspsych/dist/index.browser.min.js"></script>
    <script src="https://unpkg.com/@jspsych/plugin-survey-text"></script>
    <script src="https://unpkg.com/@jspsych/plugin-html-keyboard-response"></script>
    <script src="https://unpkg.com/@jspsych/plugin-preload"></script>
    <!-- HAWKINS PAID-PILOT CANDIDATE: still on the LOCAL adapter for two-tab piloting. A real paid
         run still needs a deployed pairing adapter/waiting room and shared dyad IDs; this file only
         ports the paid-run participant/data/terminal-route plumbing onto the Hawkins task. -->
    <!-- PROTOTYPE: branch-built bundles from vendor/ (see vendor/README.md for provenance).
         Pre-release pins — repoint to published versions after upstream PR #80 + PR #35. -->
    <script src="vendor/adapter-multiplayer-local.js"></script>
    <script src="vendor/plugin-multiplayer-sync.js"></script>
    <script src="vendor/plugin-multiplayer-role.js"></script>
    <script src="vendor/plugin-multiplayer-reference-game.js"></script>
    <script src="tangrams.js"></script>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/jspsych/jsPsych@151ab520542a8e48bcc4d5b21c74cdffae8b48c6/packages/jspsych/css/jspsych.css"
    />
    <style>
      /* STIMULUS GEOMETRY — reproduced from hawkrobe/tangrams `tangrams_sequential` (the "cued"
         version), OSF osf.io/vzvmf.
         Original: game.core.js lays out a 6×2 grid of SQUARE 300×300px cells, and
         stimuli/objectSet.js gives every tangram an explicit draw size that is exactly 0.7× its
         natural PNG size — e.g. A 403×393 → 282.1×275.1, J 253×356 → 151.8×249.2. Each image is
         centred in its cell at that size.

         The consequence, and it is deliberate in the original: the tangrams are NOT normalised to a
         common size. One uniform scale factor is applied to all twelve, so their relative sizes are
         preserved — J really is drawn smaller than C. Fitting each image to its box instead would
         change those ratios and hand participants a size cue the original never had.

         So each width below is `originalDrawWidth / 300`, expressed as a percentage of the cell's
         content box — which makes the content box play the part of the original's 300px cell and
         keeps the geometry exact at any `cell_size`. Heights follow from the aspect ratio and all
         stay under 100% (tallest is L at 93.6%). */
      .jspsych-multiplayer-reference-game .jspsych-multiplayer-reference-game-cell {
        aspect-ratio: 1 / 1; /* the original's square 300×300 cell */
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .jspsych-multiplayer-reference-game .jspsych-multiplayer-reference-game-cell-content {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .jspsych-multiplayer-reference-game .jspsych-multiplayer-reference-game-cell-content img {
        width: auto;
        height: auto;
        max-width: none;
        max-height: none;
      }
      /* originalDrawWidth / 300, per stimuli/objectSet.js */
      .jspsych-multiplayer-reference-game img[src$="tangram_A.png"] { width: 94.03%; }
      .jspsych-multiplayer-reference-game img[src$="tangram_B.png"] { width: 78.40%; }
      .jspsych-multiplayer-reference-game img[src$="tangram_C.png"] { width: 97.77%; }
      .jspsych-multiplayer-reference-game img[src$="tangram_D.png"] { width: 63.00%; }
      .jspsych-multiplayer-reference-game img[src$="tangram_E.png"] { width: 68.17%; }
      .jspsych-multiplayer-reference-game img[src$="tangram_F.png"] { width: 87.27%; }
      .jspsych-multiplayer-reference-game img[src$="tangram_G.png"] { width: 94.97%; }
      .jspsych-multiplayer-reference-game img[src$="tangram_H.png"] { width: 58.33%; }
      .jspsych-multiplayer-reference-game img[src$="tangram_I.png"] { width: 74.17%; }
      .jspsych-multiplayer-reference-game img[src$="tangram_J.png"] { width: 50.60%; }
      .jspsych-multiplayer-reference-game img[src$="tangram_K.png"] { width: 61.60%; }
      .jspsych-multiplayer-reference-game img[src$="tangram_L.png"] { width: 60.90%; }

      /* The original highlights the feedback cell GREEN regardless of correctness — it never draws a
         "wrong" colour, and the score counter is the only channel carrying the outcome. The plugin
         colours the matcher's choice red when it missed, so repaint that to match. Doubled-up
         selectors to outrank the plugin's own (later-injected) stylesheet. */
      .jspsych-multiplayer-reference-game .jspsych-multiplayer-reference-game-cell.is-wrong {
        border-color: #2b8a3e;
        box-shadow: 0 0 0 2px rgba(43, 138, 62, 0.35);
      }
      .jspsych-multiplayer-reference-game .jspsych-multiplayer-reference-game-mark.is-wrong {
        background: #2b8a3e;
      }

      /* "Partner is typing…" hint rendered by the plugin's `typing_indicator` option. The original
         has one too (sharedUtils/clientBase.js sends `playerTyping.true/false` and renders
         "Other player is typing..." in the message log). */
      .jspsych-multiplayer-reference-game .jspsych-multiplayer-reference-game-typing-hint {
        min-height: 1.2em;
        margin-bottom: 0.3em;
        font-size: 0.9em;
        font-style: italic;
        color: #555;
        text-align: left;
      }
      .jspsych-multiplayer-reference-game .jspsych-multiplayer-reference-game-typing-hint[hidden] {
        display: block;
        visibility: hidden;
      }
    </style>
  </head>

  <body></body>
  <script>
    // ===============================================================================================
    // REFERENCE GAME — replication of Hawkins, Frank & Goodman (2020), "Characterizing the Dynamics of
    // Learning in Repeated Reference Games" (Cognitive Science 44, e12845); the "sequential" condition.
    //
    // Faithful design (from the paper + github.com/hawkrobe/tangrams):
    //   • 12 tangrams (the canonical set, shared with Clark & Wilkes-Gibbs 1986), in a 6×2 grid,
    //     independently scrambled per player each trial (can't point by position).
    //   • SINGLE target per trial; the matcher clicks the one tangram they think the director means.
    //   • Faithful Hawkins uses 6 repetition blocks × 12 trials = 72 trials; each tangram is the
    //     target once per block. This paid-pilot candidate intentionally uses 3 blocks = 36 trials.
    //   • Director/matcher roles fixed for the whole game.
    //   • "Cued" version: only the director sees which tangram is the target (reveal_target_to).
    //   • Free text chat, UNRESTRICTED both ways (both may send, no count/length limit) — the paper's
    //     exact channel, and what makes the reference-shortening effect possible.
    //   • Full immediate feedback to both: the director sees the matcher's click, the matcher sees the
    //     intended tangram.
    //   • The matcher cannot click until the director has sent a message that round
    //     (require_message_before_response), so a referring expression exists on every trial and the
    //     matcher can't blind-guess to rush through — verified in hawkrobe/tangrams game.client.js,
    //     where the click handler is gated behind `if (globalGame.messageSent)`.
    //
    // Re-audited line by line against the original source (OSF osf.io/vzvmf → github component =
    // hawkrobe/tangrams, `experiments/tangrams_sequential`, i.e. the "cued" version — the README
    // there defines cued as "a sequential version that cues each target in a sequence of trials").
    // Confirmed identical in the full-fidelity version: 2 players; fixed director/matcher; 6×2 grid
    // of SQUARE cells; 72 rounds as 6 shuffled blocks of 12 (game.core.js
    // `getRandomizedConditions`); layouts re-randomised every round, independently per player;
    // target revealed to the director only; unrestricted two-way chat; per-round chat log; the
    // matcher-click gate (`globalGame.messageSent`); 3000ms of feedback before the next round
    // (game.server.js `setTimeout(..., 3000)`); a typing indicator (sharedUtils/clientBase.js
    // `playerTyping`); and a persistent round counter + running score. The paid pilot departs from
    // that schedule only by using 3 blocks instead of 6, and records that in every saved row.
    //
    // Position disjointness and per-role feedback were gaps until the plugin gained
    // `scramble_mode: "disjoint"` and role-keyed `feedback_content`; both are now used below, and
    // the always-green feedback highlight is restored in CSS. ONE known difference remains:
    //   Gate semantics. The original sets `messageSent` in its `chatMessage` handler, which fires
    //      for ANY message including the matcher's own — so a matcher could unlock their own click by
    //      typing anything. The plugin counts only the PARTNER's message. Ours is the stricter (and,
    //      judging by the source comment, the intended) reading.
    //
    // `round_timeout` (60s) has no counterpart in the original, which ran untimed. It exists so a
    // disconnected or absent partner cannot hang the trial forever, but it is an unconditional round
    // clock, not proof of dropout. The paid-pilot routes below infer partner dropout only after
    // consecutive silent timed-out rounds.
    //
    // Key DVs (logged per round): message_count / messages_sent (words-per-reference proxy),
    // accuracy / correct, rt. In this shortened pilot, operational outcomes are primary; the
    // reference-shortening replication is secondary and should not be described as a full 6-block
    // Hawkins replication.
    // ===============================================================================================

    const MIN_PLAYERS = 2;

    const CONFIG = {
      PILOT_LABEL: "hawkins-three-block-paid-pilot",
      BLOCKS: 3,
      COMPLETION_CODES: {
        complete: "",
        partner_dropped: "",
        no_match: "",
        screened_out: "",
      },
      ROUND_TIMEOUT_MS: 60000,
      DATAPIPE_EXPERIMENT_ID: "",
      LOBBY_TIMEOUT_MS: 300000,
      NO_MATCH_PAYMENT_USD: 1.25,
      DROPOUT_SILENT_ROUNDS: 2,
      SAVE_PER_ROUND: true,
      FLUSH_ON_ABORT: true,
      SAVE_MAX_ATTEMPTS: 3,
      SAVE_BASE_BACKOFF_MS: 500,
      SAVE_REDIRECT_BUDGET_MS: 3000,
      PROLIFIC_SUBMIT_URL: "https://app.prolific.com/submissions/complete",
    };

    const BLOCKS = CONFIG.BLOCKS;

    const jsPsych = initJsPsych();
    const localAdapter = new jsPsychAdapterMultiplayerLocal({ persistParticipant: true });

    /**
     * Deployment-specific work ends here. The timeline below receives a stable dyad key and,
     * when a deployment can provide it, an allocated roster. A future JATOS/Firebase bootstrap
     * may obtain those values differently, but must not make the Hawkins timeline inspect an
     * adapter-specific API.
     */
    async function connectLocalDeployment() {
      await jsPsych.multiplayer.connect(localAdapter);
      const sessionId = new URLSearchParams(location.search).get("mp_session");
      if (!sessionId) {
        throw new Error(
          "Local multiplayer bootstrap did not produce an mp_session value after connecting.",
        );
      }
      return {
        sessionId,
        // The local adapter's stable per-client id, surfaced behind the portable field so the
        // timeline never reads adapter identity inline (the JATOS bootstrap returns its own).
        participantId: localAdapter.participantId ?? null,
        allocatedParticipantIds: null,
        // The local adapter has no server-side allocation to lock. Keep the same hook shape as
        // production deployments so the timeline never needs to know which backend it is using.
        finalizeAllocation: async () => null,
      };
    }

    const SHAPES = Tangrams.STIMULI; // 12 canonical tangrams (ids A–L, image src)
    // Seed the schedule from the SHARED SESSION ID, so each dyad gets its own trial order while the
    // two partners still agree on it. A fixed seed would hand every dyad the identical order, which
    // confounds item order with repetition block — the very axis this study measures.
    //
    // Local two-tab: read AFTER the adapter is constructed, deliberately: on the first tab there is
    // no `?mp_session=` yet, and the LocalAdapter constructor is what generates one and writes it
    // into the URL. The second tab arrives with it already in the pasted link, so both compute the
    // same schedule. Deployment adapters (e.g. JATOS groupResultId) only know the shared session
    // AFTER connect, so a null seed here means "adopt bootstrap.sessionId once connected" (below) —
    // the requirement is only that both partners derive the same value.
    let SEED = new URLSearchParams(location.search).get("mp_session") ?? null;
    // 36 paid-pilot rounds: 3 blocks × 12, each tangram once per block. Deterministic given the
    // seed, so both tabs agree without exchanging anything. Recomputed post-connect when the seed
    // was deployment-supplied; `config_trials` below only reads the length, which never changes.
    let SCHEDULE = SEED != null ? Tangrams.sequentialSchedule(BLOCKS, SEED) : [];

    const prolificParams = new URLSearchParams(location.search);
    const PROLIFIC_PID = prolificParams.get("PROLIFIC_PID");
    const STUDY_ID = prolificParams.get("STUDY_ID");
    const SESSION_ID = prolificParams.get("SESSION_ID");
    // Null until the bootstrap resolves (below): local two-tab reads it from the URL, deployment
    // adapters adopt the deployment session id. Re-stamped into jsPsych data once connected.
    let DYAD_ID = prolificParams.get("mp_session") ?? null;

    jsPsych.data.addProperties({
      prolific_pid: PROLIFIC_PID,
      study_id: STUDY_ID,
      session_id: SESSION_ID,
      dyad_id: DYAD_ID,
      // Overwritten from bootstrap.participantId once connected (below): the timeline must not
      // read adapter-private identity, so no adapter handle appears here.
      participant_id: null,
      experiment_file: "reference-game-hawkins.html",
      study_variant: CONFIG.PILOT_LABEL,
      config_blocks: CONFIG.BLOCKS,
      config_trials: SCHEDULE.length,
      config_n_stimuli: SHAPES.length,
      config_round_timeout_ms: CONFIG.ROUND_TIMEOUT_MS,
      viewport_w: window.innerWidth,
      viewport_h: window.innerHeight,
      screen_w: window.screen?.width ?? null,
      screen_h: window.screen?.height ?? null,
      user_agent: navigator.userAgent,
    });

    function submissionBlockHTML(codeKey) {
      const code = CONFIG.COMPLETION_CODES[codeKey];
      if (!code) {
        return `<p style="color:#b00"><strong>Something has gone wrong on our end.</strong> Your
                responses have been recorded, but the completion code for this exit
                (<code>${codeKey}</code>) is missing, so the automatic submission cannot run.</p>
                <p style="color:#b00">Please <strong>message the researcher from this study's page on
                Prolific</strong> and quote <code style="user-select:all">${codeKey}</code>. You will be
                paid — do not return the study. Please keep this tab open until you have sent it.</p>`;
      }
      return `<p><button id="prolific-submit" type="button">Submit and return to Prolific</button></p>
              <p style="font-size:0.9em">If that button does not work, your completion code is
              <code style="user-select:all">${code}</code> — paste it into Prolific to submit.</p>`;
    }

    function redirectToProlific(codeKey) {
      const code = CONFIG.COMPLETION_CODES[codeKey];
      if (!code) {
        console.error(`No Prolific completion code configured for "${codeKey}".`);
        return;
      }
      window.location.href = `${CONFIG.PROLIFIC_SUBMIT_URL}?cc=${encodeURIComponent(code)}`;
    }

    function wireSubmissionButton(codeKey) {
      document
        .getElementById("prolific-submit")
        ?.addEventListener("click", () => redirectToProlific(codeKey));
    }

    (function warnOnUnsetConfig() {
      const unset = Object.entries(CONFIG.COMPLETION_CODES)
        .filter(([, v]) => !v)
        .map(([k]) => k);
      if (unset.length) console.warn(`Unset Prolific completion code(s): ${unset.join(", ")}`);
      if (!CONFIG.DATAPIPE_EXPERIMENT_ID) {
        console.warn("DataPipe experiment ID is unset; remote saving is inert.");
      }
      if (DYAD_ID == null || SEED == null) {
        console.warn("DYAD_ID/SEED are deployment-supplied; adopting them after connect.");
      }
    })();

    const DATAPIPE_ENDPOINT = "https://pipe.jspsych.org/api/data/";

    const Pipeline = (() => {
      let claimedUntil = 0;
      let chunkSeq = 0;
      const pending = [];
      const log = [];
      const nonce = () =>
        `${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 8)}`;

      function classify(status, error) {
        if (status >= 200 && status < 300) return "ok";
        if (status === 400 && error === "OSF_FILE_EXISTS") return "exists";
        if (status === 429 || status >= 500) return "retry";
        return "terminal";
      }

      const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

      function claimRows() {
        const rows = jsPsych.data.get().values();
        const claims = [];
        for (const p of pending.splice(0)) claims.push(p);
        if (claimedUntil < rows.length) {
          claims.push({ start: claimedUntil, end: rows.length - 1 });
          claimedUntil = rows.length;
        }
        const merged = [];
        for (const r of claims.sort((a, b) => a.start - b.start)) {
          const last = merged.at(-1);
          if (last && r.start <= last.end + 1) last.end = Math.max(last.end, r.end);
          else merged.push({ ...r });
        }
        return {
          rows,
          ranges: merged,
          trials: merged.flatMap(({ start, end }) => rows.slice(start, end + 1)),
        };
      }

      function requeue(ranges) {
        pending.push(...ranges.map((r) => ({ ...r })));
      }

      async function postChunk(payload) {
        const response = await fetch(DATAPIPE_ENDPOINT, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });
        const body = await response.json().catch(() => ({}));
        return {
          status: response.status,
          retryAfter: Number(response.headers.get("Retry-After") ?? 0),
          error: body.error ?? null,
        };
      }

      async function save(label) {
        if (!CONFIG.DATAPIPE_EXPERIMENT_ID) return { ok: false, skipped: true };
        const claim = claimRows();
        if (!claim.trials.length) return { ok: true, empty: true };

        const seq = chunkSeq++;
        const fileNonce = nonce();
        const safeParticipant = bootstrap?.participantId ?? "unknown-participant";
        const safeDyad = DYAD_ID ?? SEED ?? "unknown-dyad";
        const filename = `${safeDyad}_${safeParticipant}_${seq}_${label}_${fileNonce}.json`;
        const payload = {
          experimentID: CONFIG.DATAPIPE_EXPERIMENT_ID,
          filename,
          data: JSON.stringify({
            dyad_id: DYAD_ID,
            prolific_pid: PROLIFIC_PID,
            participant_id: bootstrap?.participantId ?? null,
            chunk_seq: seq,
            chunk_label: label,
            row_ranges: claim.ranges.map(({ start, end }) => [start, end]),
            trials: claim.trials,
            saved_at: new Date().toISOString(),
          }),
        };

        let last = null;
        for (let attempt = 1; attempt <= CONFIG.SAVE_MAX_ATTEMPTS; attempt++) {
          try {
            last = await postChunk(payload);
            const kind = classify(last.status, last.error);
            if (kind === "ok") {
              const rec = JSON.parse(payload.data);
              log.push({ filename, ...rec });
              return { ok: true, status: last.status };
            }
            if (kind === "exists" && attempt > 1) {
              const rec = JSON.parse(payload.data);
              log.push({ filename, ...rec, replayed: true });
              return { ok: true, replayed: true, status: last.status };
            }
            if (kind === "terminal" || kind === "exists") {
              requeue(claim.ranges);
              return { ok: false, status: last.status, error: last.error };
            }
            const wait = last.retryAfter ? last.retryAfter * 1000 : CONFIG.SAVE_BASE_BACKOFF_MS * attempt;
            await sleep(wait);
          } catch (err) {
            last = { error: err?.message ?? String(err) };
            if (attempt < CONFIG.SAVE_MAX_ATTEMPTS) await sleep(CONFIG.SAVE_BASE_BACKOFF_MS * attempt);
          }
        }
        requeue(claim.ranges);
        return { ok: false, error: last?.error ?? "save_failed" };
      }

      async function flush(label) {
        const timeout = new Promise((resolve) =>
          setTimeout(() => resolve({ ok: false, timedOut: true }), CONFIG.SAVE_REDIRECT_BUDGET_MS)
        );
        return Promise.race([save(label), timeout]);
      }

      return { save, flush, log: () => log.slice(), _classify: classify };
    })();

    // The 12 tangrams are real PNGs, and `rt` is a reported DV — without this the first exposure to
    // each image loads mid-trial. `stimuli` is an OBJECT parameter, so jsPsych's automatic media
    // preloading cannot discover the `src` values; they have to be listed explicitly.
    const preloadTrial = {
      type: jsPsychPreload,
      images: SHAPES.map((s) => s.src),
      message: "<p>Loading…</p>",
    };

    let myName = "";
    let myRole;
    let partnerId;
    let bootstrap;
    let observedRosterIds = [];
    let noMatch = false;
    let noMatchReason = null;
    let partnerDropped = false;
    let dropoutRound = null;
    let consecutiveSilentRounds = 0;
    let endedReason = null;

    const completedTrials = () =>
      jsPsych.data
        .get()
        .filter({ trial_type: "multiplayer-reference-game", ended_by: "submit" })
        .count();

    function recordOutcome(reason) {
      if (endedReason) return;
      endedReason = reason;
      jsPsych.data.addProperties({
        ended_reason: reason,
        n_trials_completed: completedTrials(),
        n_trials_scheduled: SCHEDULE.length,
        n_blocks_scheduled: CONFIG.BLOCKS,
        blocks_completed: Math.floor(completedTrials() / SHAPES.length),
        dropout_detected_at_round: dropoutRound,
        no_match_reason: noMatchReason,
      });
    }

    const nameTrial = {
      type: jsPsychSurveyText,
      questions: [{ prompt: "Choose a display name:", required: true, name: "name" }],
      on_finish: (data) => {
        myName = (data.response.name || "").trim() || "Anonymous";
      },
    };

    const money = (usd) => `$${usd.toFixed(2)}`;

    let lobbyTicker = null;

    const lobbyTrial = {
      type: jsPsychMultiplayerSync,
      push_data: () => ({ name: myName, joinedAt: Date.now() }),
      timeout: CONFIG.LOBBY_TIMEOUT_MS,
      message: `<p>Waiting for a partner to join…</p>
                <p>This study is played in pairs, so we need to match you with someone before we can
                   start. Most people are matched quickly.</p>
                <p><strong>Time remaining: <span id="lobby-remaining">—</span></strong></p>
                <p style="font-size:0.9em;color:#555">If we cannot find you a partner in time, we will
                   end the study and <strong>still pay you ${money(
                     CONFIG.NO_MATCH_PAYMENT_USD
                   )}</strong> for waiting. You do not need to do anything.</p>
                <p style="font-size:0.85em;color:#888">Testing locally? Open this page in another tab,
                   keeping the <code>?mp_session=</code> in the URL.</p>`,
      wait_for: (group) =>
        Object.values(group).filter((entry) => entry && entry.name).length >= MIN_PLAYERS,
      on_load: () => {
        const deadline = Date.now() + CONFIG.LOBBY_TIMEOUT_MS;
        const el = document.getElementById("lobby-remaining");
        const tick = () => {
          const left = Math.max(0, deadline - Date.now());
          if (!el) return;
          if (left < 1000) {
            el.textContent = "finishing up…";
            return;
          }
          const m = Math.floor(left / 60000);
          const s = Math.floor((left % 60000) / 1000);
          el.textContent = `${m}:${String(s).padStart(2, "0")}`;
        };
        tick();
        lobbyTicker = setInterval(tick, 1000);
      },
      on_finish: (data) => {
        clearInterval(lobbyTicker);
        lobbyTicker = null;
        if (data.timed_out) {
          noMatch = true;
          noMatchReason = "lobby_timeout";
        }
      },
    };

    /**
     * `getAll()` is visible participant state, not an immutable membership authority. When a
     * deployment has supplied a roster, compare against it exactly. The local two-tab bootstrap
     * deliberately has no such roster, so it can only enforce the weaker exact-count check.
     */
    const rosterValidationTrial = {
      type: jsPsychHtmlKeyboardResponse,
      stimulus: "<p>Checking the pairing…</p>",
      choices: "NO_KEYS",
      trial_duration: 0,
      on_finish: () => {
        if (noMatch) return;
        const group = jsPsych.multiplayer.getAll();
        observedRosterIds = Object.entries(group)
          .filter(([, entry]) => entry && entry.name)
          .map(([id]) => id)
          .sort();
        const allocated = bootstrap?.allocatedParticipantIds?.slice().sort() ?? null;

        if (observedRosterIds.length < MIN_PLAYERS) {
          noMatch = true;
          noMatchReason = "roster_undershoot";
        } else if (observedRosterIds.length > MIN_PLAYERS) {
          noMatch = true;
          noMatchReason = "roster_overshoot";
        } else if (
          allocated !== null &&
          (allocated.length !== MIN_PLAYERS ||
            allocated.some((id, index) => id !== observedRosterIds[index]))
        ) {
          noMatch = true;
          noMatchReason = "roster_unexpected_identity";
        }

        jsPsych.data.addProperties({
          bootstrap_session_id: bootstrap?.sessionId ?? null,
          bootstrap_roster_supplied: allocated !== null,
          observed_roster_ids: observedRosterIds,
          observed_roster_count: observedRosterIds.length,
        });
      },
    };

    /**
     * A deployment that owns allocation can atomically finish its own admission work here and
     * return the roster that the timeline must validate. The local implementation is a no-op.
     * This hook is deliberately outside every multiplayer plugin: plugins remain portable and do
     * not depend on optional backend lifecycle APIs.
     */
    const finalizeAllocationTrial = {
      type: jsPsychHtmlKeyboardResponse,
      stimulus: "<p>Finalizing the pairing...</p>",
      choices: "NO_KEYS",
      on_load: async () => {
        try {
          // finalizeAllocation is optional: deployments without an allocated roster (local two-tab
          // smoke, stock JATOS) report null and skip straight to roster validation.
          const allocation = await bootstrap.finalizeAllocation?.();
          if (allocation != null) {
            if (allocation.sessionId !== bootstrap.sessionId) {
              throw new Error("Allocation finalization changed the dyad session ID.");
            }
            bootstrap = { ...bootstrap, ...allocation };
          }
          jsPsych.finishTrial({
            allocation_finalized: true,
            allocated_roster_ids: bootstrap.allocatedParticipantIds ?? null,
          });
        } catch (error) {
          console.error("Could not finalize the multiplayer allocation", error);
          noMatch = true;
          noMatchReason = "allocation_finalize_error";
          jsPsych.finishTrial({
            allocation_finalized: false,
            allocation_error: error instanceof Error ? error.message : String(error),
          });
        }
      },
    };

    // Fixed director/matcher for the whole game, assigned by deterministic consensus (shared seed from
    // the sorted participant ids) — not "whoever joined first". Use "join_order" while testing if you
    // want the first tab to always be the director.
    const roleTrial = {
      type: jsPsychMultiplayerRole,
      roles: ["director", "matcher"],
      strategy: "random",
      group_size: MIN_PLAYERS,
      ready: (group) =>
        Object.keys(group).length === MIN_PLAYERS &&
        Object.values(group).every((entry) => entry && entry.joinedAt != null),
      save_group: true,
      message: "<p>Pairing you with your partner…</p>",
      on_finish: () => {
        myRole = jsPsychMultiplayerRole.getMyRole();
        const byRole = jsPsychMultiplayerRole.participantsByRole();
        partnerId = myRole === "director" ? byRole.matcher?.[0] : byRole.director?.[0];
        if (myRole !== "director" && myRole !== "matcher") {
          noMatch = true;
          noMatchReason = "pairing_timeout";
        }
      },
    };

    const pairingPhase = {
      timeline: [roleTrial],
      conditional_function: () => !noMatch,
    };

    const noMatchScreen = {
      timeline: [
        {
          type: jsPsychHtmlKeyboardResponse,
          stimulus: () => {
            const waited =
              noMatchReason === "roster_overshoot"
                ? `<p>You arrived in time, but another pair had already formed, so there was no one
                     left for us to match you with. That is our scheduling problem, not anything you
                     did.</p>`
                : noMatchReason === "roster_unexpected_identity"
                ? `<p>We could not verify a stable pairing for this session, so we ended the study
                     before the task began. That is our technical issue, not anything you did.</p>`
                : `<p>We could not find you a partner in the time available. This happens when not
                     enough people happen to be online at the same moment — it is nothing to do with
                     you or your responses.</p>`;
            return `<h2>We could not match you with a partner</h2>
                ${waited}
                <p><strong>You will still be paid ${money(
                  CONFIG.NO_MATCH_PAYMENT_USD
                )} for your time.</strong> Please submit below so we can process it.</p>
                <p id="save-status" style="font-size:0.9em;color:#666">Saving…</p>
                ${submissionBlockHTML("no_match")}`;
          },
          choices: "NO_KEYS",
          on_load: () => {
            wireSubmissionButton("no_match");
            recordOutcome(noMatchReason ?? "no_match");
            jsPsych.multiplayer.disconnect();
            Pipeline.flush(`no-match-${noMatchReason ?? "unknown"}`).then((r) => {
              const el = document.getElementById("save-status");
              if (!el) return;
              el.textContent = r.skipped
                ? ""
                : r.ok
                ? "Saved."
                : r.timedOut
                ? "Still uploading — you can submit now, this will finish in the background."
                : "Upload failed. Please submit anyway and message the researcher.";
            });
          },
        },
      ],
      conditional_function: () => noMatch,
    };

    // "Partner is typing…" comes from the plugin's `typing_indicator` option (enabled on the round
    // below with the original's TTL/throttle semantics), not a study bolt-on: all slot writes go
    // through the plugin's serialized write queue, so typing pings can neither clobber round/chat
    // data nor be clobbered by it.

    const gameRound = {
      type: jsPsychMultiplayerReferenceGame,
      stimuli: SHAPES,
      columns: 6, // 6×2 grid, as in the original
      cell_size: 130, // square cells, as in the original's 300px ones (see the <style> block)
      role: () => jsPsychMultiplayerRole.getMyRole(),
      partner_id: () => partnerId,
      round: jsPsych.timelineVariable("round"),
      targets: jsPsych.timelineVariable("targets"), // length 1 → single click (sequential)
      // "disjoint", not "independent": the original re-rolls the two layouts until NO tangram sits
      // in the same cell for both players (game.core.js `notMatchingLocs`/`arraysDifferent`). Plain
      // independent only guarantees the layouts differ, leaving ~1/e of tangrams sharing a cell by
      // chance — enough for "the one in the corner" to work by luck now and then.
      scramble_mode: "disjoint",
      reveal_target_to: "director", // "cued": only the director sees the target
      // Unrestricted free chat, both directions — the paper's exact channel (these are the defaults,
      // stated explicitly here because they are load-bearing for the effect).
      chat_role: "both",
      max_messages: null,
      max_length: null,
      // Exp. 2's click gate: no selection until the director has described the target this round.
      // Guarantees a referring expression per trial and blocks blind-guessing.
      require_message_before_response: true,
      // The original shows the round counter and the running score PERSISTENTLY, above the board
      // ("Round 5 of 72" / "Number correct: 3" — game.client.js `newRoundUpdate`), not as part of
      // per-trial feedback. So the counter moves into `prompt` (below) and this stays off.
      show_running_score: false,
      // Original feedback (game.client.js 's.feedback'): ONE green highlight per role and nothing
      // else — the director sees the object the matcher clicked, the matcher sees the true target,
      // and there is no "Correct!/Incorrect." line (correctness reaches players only through the
      // persistent score counter above). Expressed with the plugin's role-keyed feedback_content.
      feedback_content: {
        director: { reveal_target: false, show_score: false, show_partner_choice: true },
        matcher: { reveal_target: true, show_score: false, show_partner_choice: false },
      },
      round_timeout: CONFIG.ROUND_TIMEOUT_MS, // NOT in the original — bounds the round if the partner leaves
      save_interaction_history: true,
      // Instruction wording taken from the original (game.client.js `client_onjoingame`). The one
      // edit: the original tells BOTH roles they may "talk to the director", plainly a copy-paste
      // slip in the source, so the matcher's copy names the director and the director's the matcher.
      // The round counter and score line reproduce the original's persistent #roundnumber/#score.
      prompt: (role) => {
        const finished = jsPsych.data.get().filter({ trial_type: "multiplayer-reference-game" });
        const score = finished.filter({ correct: true }).count();
        // Counted from finished rounds rather than read from the timeline variable, so it needs no
        // timeline-context API and still matches the original, whose roundNum advances on every
        // round regardless of outcome.
        const roundNum = finished.count() + 1;
        const header = `<p>Round ${roundNum} of ${SCHEDULE.length} &nbsp;|&nbsp; Number correct: ${score}</p>`;
        // Kept on single lines on purpose: a line break inside a template literal is a real newline
        // in the rendered string.
        const director =
          "Send messages to help the matcher pick the target image." +
          " You are free to use the chatbox to talk to the matcher at any time.";
        const matcher =
          "Select the correct target out of the lineup." +
          " You are free to use the chatbox to talk to the director at any time.";
        return role === "director"
          ? `${header}<p><strong>You are the Director.</strong> ${director}</p>`
          : `${header}<p><strong>You are the Matcher.</strong> ${matcher}</p>`;
      },
      // The original has a typing indicator too (sharedUtils/clientBase.js: `playerTyping.true` on
      // input, `.false` when the box is emptied, rendered as "Other player is typing..."), provided
      // here by the plugin's serialized write queue rather than a study bolt-on.
      typing_indicator: true, // TTL 2500ms / throttle 800ms are the plugin defaults, matching the original
      on_finish: (data) => {
        if (CONFIG.SAVE_PER_ROUND) Pipeline.save(`round-${data.round ?? "?"}`);

        const partnerMessages = (data.message_count ?? 0) - (data.messages_sent ?? 0);
        const silent = data.ended_by === "timeout" && partnerMessages <= 0;
        consecutiveSilentRounds = silent ? consecutiveSilentRounds + 1 : 0;

        if (!partnerDropped && consecutiveSilentRounds >= CONFIG.DROPOUT_SILENT_ROUNDS) {
          partnerDropped = true;
          dropoutRound = data.round ?? null;
          recordOutcome("partner_dropped");
          jsPsych.abortCurrentTimeline();
        }
      },
    };

    const gameLoop = {
      timeline: [gameRound],
      timeline_variables: SCHEDULE,
      conditional_function: () => myRole === "director" || myRole === "matcher",
    };

    const partnerDroppedScreen = {
      timeline: [
        {
          type: jsPsychHtmlKeyboardResponse,
          stimulus: () => {
            const played = completedTrials();
            return `<h2>Your partner seems to have disconnected</h2>
                <p>We waited, but your partner stopped responding, so we have ended the study here.
                   <strong>This is not your fault, and your payment is not affected.</strong></p>
                <p>You completed ${played} of ${SCHEDULE.length} round${played === 1 ? "" : "s"} together, and
                   ${played > 0 ? "that work is saved and still useful to us" : "your time is still paid"}.</p>
                <p id="save-status" style="font-size:0.9em;color:#666">Saving your responses…</p>
                ${submissionBlockHTML("partner_dropped")}`;
          },
          choices: "NO_KEYS",
          on_load: () => {
            wireSubmissionButton("partner_dropped");
            jsPsych.multiplayer.disconnect();
            Pipeline.flush("abort-partner-dropped").then((r) => {
              const el = document.getElementById("save-status");
              if (!el) return;
              el.textContent = r.skipped
                ? ""
                : r.ok
                ? "Your responses have been saved."
                : r.timedOut
                ? "Still uploading — you can submit now, this will finish in the background."
                : "Your responses could not be uploaded. Please submit anyway and message the researcher.";
            });
          },
        },
      ],
      conditional_function: () => partnerDropped,
    };

    const doneTrial = {
      type: jsPsychHtmlKeyboardResponse,
      stimulus: () => {
        const completed = jsPsych.data
          .get()
          .filter({ trial_type: "multiplayer-reference-game", ended_by: "submit" });
        const played = completed.count();
        const correct = completed.filter({ correct: true }).count();
        return `<h2>Game complete!</h2>
                <p>Together you got <strong>${correct} of ${played}</strong> round${
          played === 1 ? "" : "s"
        } correct.</p>
                <p>Thank you — please submit to complete the study.</p>
                <p id="save-status" style="font-size:0.9em;color:#666">Saving your responses…</p>
                ${submissionBlockHTML("complete")}
                <p style="font-size:0.85em;color:#666">
                  Researcher tools: <button id="dl" type="button">Download data (JSON)</button>
                </p>`;
      },
      choices: "NO_KEYS",
      on_load: () => {
        wireSubmissionButton("complete");
        recordOutcome("complete");
        Pipeline.flush("complete").then((r) => {
          const el = document.getElementById("save-status");
          if (!el) return;
          el.textContent = r.skipped
            ? ""
            : r.ok
            ? "Your responses have been saved."
            : r.timedOut
            ? "Still uploading — you can submit now, this will finish in the background."
            : "Your responses could not be uploaded. Please submit anyway and message the researcher.";
        });
        document
          .getElementById("dl")
          ?.addEventListener("click", () =>
            jsPsych.data.get().localSave("json", "reference-game-hawkins-data.json")
          );
      },
    };

    const completeScreen = {
      timeline: [doneTrial],
      conditional_function: () =>
        !partnerDropped && (myRole === "director" || myRole === "matcher"),
    };

    connectLocalDeployment()
      .then((connectedBootstrap) => {
        bootstrap = connectedBootstrap;
        if (bootstrap.bootstrapError != null) {
          // Bootstrap failure, not a session: route to the no-group path through normal
          // conditionals. A pre-run() throw here would be a dead page.
          console.error("Multiplayer bootstrap failed:", bootstrap.bootstrapError);
          noMatch = true;
          noMatchReason = "bootstrap_error";
          jsPsych.run([noMatchScreen]);
          return;
        }
        jsPsych.data.addProperties({ participant_id: bootstrap.participantId ?? null });
        if (DYAD_ID == null || SEED == null) {
          // Deployment-owned session (e.g. JATOS groupResultId): adopt it for the dyad id and the
          // schedule seed, then rebuild the schedule BEFORE run so both partners derive the same
          // order. gameLoop captured the placeholder by reference at eval; repoint it.
          if (bootstrap.sessionId == null) {
            throw new Error("Deployment bootstrap supplied no session ID to derive the schedule from.");
          }
          DYAD_ID ??= bootstrap.sessionId;
          SEED ??= bootstrap.sessionId;
          SCHEDULE = Tangrams.sequentialSchedule(BLOCKS, SEED);
          gameLoop.timeline_variables = SCHEDULE;
          jsPsych.data.addProperties({ dyad_id: DYAD_ID });
        }
        if (bootstrap.sessionId !== DYAD_ID || bootstrap.sessionId !== SEED) {
          throw new Error("Local deployment bootstrap disagrees with the schedule/dyad session ID.");
        }
      // Preload FIRST, before pairing: a participant who is still fetching images while their
      // partner waits in the lobby wastes the partner's time.
        jsPsych.run([
          preloadTrial,
          nameTrial,
          lobbyTrial,
          finalizeAllocationTrial,
          rosterValidationTrial,
          pairingPhase,
          gameLoop,
          noMatchScreen,
          partnerDroppedScreen,
          completeScreen,
        ]);
      })
      .catch((error) => {
        console.error("Could not initialize the local multiplayer deployment", error);
        noMatch = true;
        noMatchReason = "bootstrap_error";
        jsPsych.run([noMatchScreen]);
      });
  </script>
</html>
