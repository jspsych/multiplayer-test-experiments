<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Reference Game — Hawkins et al. 2020 replication (sequential) — jsPsych multiplayer</title>
    <!-- Served by JATOS inside a study. On a local server it 404s harmlessly, and the page runs on
         the local adapter instead (see `onJatos` below). -->
    <script src="jatos.js"></script>
    <!-- Everything else loads from vendor/, which `node scripts/vendor.mjs` fills: jsPsych core
         (a preview build of jsPsych#3694, which adds jsPsych.multiplayer), the jsPsych plugins, and
         the jspsych-multiplayer bundles, each at the version recorded in vendor/manifest.json.
         Local copies rather than CDN links, so a JATOS study carries its own dependencies. -->
    <script src="vendor/jspsych.js"></script>
    <script src="vendor/plugin-html-keyboard-response.js"></script>
    <script src="vendor/plugin-preload.js"></script>
    <script src="vendor/plugin-call-function.js"></script>
    <script src="vendor/extension-pipe.js"></script>
    <script src="vendor/adapter-multiplayer-local.js"></script>
    <script src="vendor/adapter-multiplayer-jatos.js"></script>
    <script src="vendor/plugin-multiplayer-role.js"></script>
    <script src="vendor/plugin-multiplayer-reference-game.js"></script>
    <script src="tangrams.js"></script>
    <script src="hawkins.js"></script>
    <script src="presence-check.js"></script>
    <script src="hawkins-ui.js"></script>
    <script src="hawkins-onboarding.js"></script>
    <link rel="stylesheet" href="vendor/jspsych.css" />
    <style>
      /* STIMULUS GEOMETRY, reproduced from hawkrobe/tangrams `tangrams_sequential` (the "cued"
         version), OSF osf.io/vzvmf.
         The original lays out a 6×2 grid of square 300×300px cells (game.core.js), and
         stimuli/objectSet.js gives each tangram an explicit draw box, e.g. A 282.1×275.1 and
         J 151.8×249.2. drawImage stretches each PNG to fill its box, so the drawn proportions are
         the box's, not the PNG's. They are not normalised to a common size: J really is drawn
         narrower than C, and fitting each image to its cell would hand participants a size cue the
         original never had.

         So each image gets the original box: width as `drawWidth / 300` of the cell's content box
         (which plays the part of the 300px cell, so the geometry holds at any `cell_size`), and
         `aspect-ratio` as `drawWidth / drawHeight`. A non-auto aspect-ratio overrides the PNG's own
         proportions, stretching it as drawImage does. */
      .jspsych-multiplayer-reference-game .jspsych-multiplayer-reference-game-cell {
        aspect-ratio: 1 / 1;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .jspsych-multiplayer-reference-game .jspsych-multiplayer-reference-game-cell-content {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .jspsych-multiplayer-reference-game .jspsych-multiplayer-reference-game-cell-content img {
        height: auto;
        max-width: none;
        max-height: none;
      }
      /* width: drawWidth / 300; aspect-ratio: drawWidth / drawHeight (stimuli/objectSet.js) */
      .jspsych-multiplayer-reference-game img[src$="tangram_A.png"] { width: 94.03%; aspect-ratio: 282.1 / 275.1; }
      .jspsych-multiplayer-reference-game img[src$="tangram_B.png"] { width: 78.40%; aspect-ratio: 235.2 / 224; }
      .jspsych-multiplayer-reference-game img[src$="tangram_C.png"] { width: 97.77%; aspect-ratio: 293.3 / 228.9; }
      .jspsych-multiplayer-reference-game img[src$="tangram_D.png"] { width: 63.00%; aspect-ratio: 189 / 271.6; }
      .jspsych-multiplayer-reference-game img[src$="tangram_E.png"] { width: 68.17%; aspect-ratio: 204.5 / 250; }
      .jspsych-multiplayer-reference-game img[src$="tangram_F.png"] { width: 87.27%; aspect-ratio: 261.8 / 219.8; }
      .jspsych-multiplayer-reference-game img[src$="tangram_G.png"] { width: 94.97%; aspect-ratio: 284.9 / 237.3; }
      .jspsych-multiplayer-reference-game img[src$="tangram_H.png"] { width: 58.33%; aspect-ratio: 175 / 273.7; }
      .jspsych-multiplayer-reference-game img[src$="tangram_I.png"] { width: 74.17%; aspect-ratio: 222.5 / 247; }
      .jspsych-multiplayer-reference-game img[src$="tangram_J.png"] { width: 50.60%; aspect-ratio: 151.8 / 249.2; }
      .jspsych-multiplayer-reference-game img[src$="tangram_K.png"] { width: 61.60%; aspect-ratio: 184.8 / 280; }
      .jspsych-multiplayer-reference-game img[src$="tangram_L.png"] { width: 60.90%; aspect-ratio: 182.7 / 280.7; }

      /* FEEDBACK COLOUR. During the round, the director's target stays the plugin amber/yellow.
         After a choice, the matcher sees the true target in green (`is-target`) and their own
         click in blue when it is wrong (`is-wrong`). The director still sees the matcher's pick
         in green either way, as in the original (score is the accuracy signal on that side). */
      .jspsych-multiplayer-reference-game .jspsych-multiplayer-reference-game-cell.is-wrong {
        border-color: #2b8a3e;
        box-shadow: 0 0 0 2px rgba(43, 138, 62, 0.35);
      }
      .jspsych-multiplayer-reference-game .jspsych-multiplayer-reference-game-mark.is-wrong {
        background: #2b8a3e;
      }
      body[data-role="matcher"] .jspsych-multiplayer-reference-game .jspsych-multiplayer-reference-game-cell.is-target {
        border-color: #2b8a3e;
        box-shadow: 0 0 0 2px rgba(43, 138, 62, 0.35);
      }
      body[data-role="matcher"] .jspsych-multiplayer-reference-game .jspsych-multiplayer-reference-game-cell.is-wrong {
        border-color: #1971c2;
        box-shadow: 0 0 0 2px rgba(25, 113, 194, 0.35);
      }
      body[data-role="matcher"] .jspsych-multiplayer-reference-game .jspsych-multiplayer-reference-game-mark.is-wrong {
        background: #1971c2;
      }

      /* ROUND HEADER (hawkins-ui.js): trial progress, number correct and time remaining in separate
         panels. The timer panel turns amber with a warning in the round's last
         CONFIG.TIMER_WARNING_SECONDS. */
      .hk-status {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin: 12px 0;
        text-align: left;
      }
      .hk-stat {
        flex: 1;
        min-width: 140px;
        padding: 10px 16px;
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        background: #f8fafc;
      }
      .hk-stat span,
      .hk-stat small {
        display: block;
        font-size: 15px;
      }
      .hk-stat strong {
        display: block;
        font-size: 26px;
        line-height: 1.35;
      }
      .hk-timer {
        background: #eaf2ff;
        border: 2px solid #315c9e;
      }
      .hk-timer.is-urgent {
        background: #fff3df;
        border-color: #9c5400;
      }
      #hk-time-hint {
        min-height: 1.3em;
        font-weight: bold;
      }

      /* The round's result under the panels during feedback: "Correct!", "Incorrect." or
         "Time's up! …". A timeout is amber, not the red of an incorrect choice. */
      .hk-round-note {
        min-height: 1.35em;
        margin: 0.2em 0;
        font-size: 24px;
        font-weight: bold;
      }
      .hk-round-note.is-correct {
        color: #2b8a3e;
      }
      .hk-round-note.is-wrong {
        color: #c92a2a;
      }
      .hk-round-note.is-timeout {
        color: #9c5400;
      }

      /* CHAT LABELS (hawkins-ui.js): a heading over the conversation, with a hint while it is empty,
         and a label and help over the input. The plugin's own "You are the …" line is hidden because
         the prompt already names the role. */
      .hk-chat-label {
        display: block;
        margin-top: 16px;
        font-size: 20px;
        font-weight: bold;
        text-align: left;
      }
      .hk-chat-help {
        margin: 4px 0 8px;
        font-size: 16px;
        text-align: left;
      }
      .hk-conversation {
        position: relative;
      }
      .hk-conversation-empty {
        display: none;
        position: absolute;
        top: 12px;
        left: 14px;
        right: 14px;
        margin: 0;
        color: #58606b;
        font-size: 16px;
        text-align: left;
        pointer-events: none;
      }
      .hk-conversation .jspsych-multiplayer-reference-game-chat-log:empty + .hk-conversation-empty {
        display: block;
      }
      .jspsych-multiplayer-reference-game .jspsych-multiplayer-reference-game-chat-log {
        min-height: 60px;
      }
      .jspsych-multiplayer-reference-game .jspsych-multiplayer-reference-game-chat-input {
        padding: 12px;
        border: 2px solid #315c9e;
        border-radius: 6px;
        background: #fff;
        font-size: 18px;
      }
      .jspsych-multiplayer-reference-game .jspsych-multiplayer-reference-game-chat-input:focus {
        outline: 3px solid #90b5ec;
        outline-offset: 2px;
      }
      .jspsych-multiplayer-reference-game .jspsych-multiplayer-reference-game-chat-send {
        padding: 12px 20px;
        border-radius: 6px;
        background: #234f90;
        color: #fff;
        font-weight: bold;
      }
      .jspsych-multiplayer-reference-game .jspsych-multiplayer-reference-game-role {
        display: none;
      }

      /* "Are you still with us?" reminder (presence-check.js). The backdrop takes clicks so the
         button is the only response; the round's timers keep running underneath. */
      .presence-check {
        position: fixed;
        inset: 0;
        z-index: 1000;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(0, 0, 0, 0.45);
      }
      .presence-check[hidden] {
        display: none;
      }
      .presence-check-card {
        max-width: 26em;
        padding: 1.2em 1.6em;
        border-radius: 8px;
        background: #fff;
        text-align: center;
        box-shadow: 0 4px 24px rgba(0, 0, 0, 0.3);
      }
      .presence-check-button {
        padding: 0.5em 1.4em;
        font-size: 1.05em;
      }
      .presence-check-remaining {
        margin-bottom: 0;
        font-size: 0.9em;
        color: #555;
      }

      /* INTERFACE WALKTHROUGH (hawkins-onboarding.js): a static preview of the game screen, revealed
         one part at a time. The plugin's own styles are not on the page until the first round, so
         the preview's grid and chat are styled here. */
      .hk-walk-copy {
        max-width: 44em;
        margin: 0 auto 20px;
        line-height: 1.45;
      }
      .hk-walk-copy h2:focus {
        outline: none;
      }
      .hk-walk-step {
        margin-bottom: 0;
        color: #58606b;
        font-size: 15px;
      }
      .hk-walk-copy button {
        padding: 10px 20px;
        font: inherit;
      }
      .hk-preview-grid {
        display: grid;
        grid-template-columns: repeat(6, minmax(0, 130px));
        gap: 8px;
        justify-content: center;
      }
      .hk-preview-grid .jspsych-multiplayer-reference-game-cell {
        border: 2px solid #ccc;
        border-radius: 6px;
      }
      .hk-preview-grid .jspsych-multiplayer-reference-game-cell.is-target {
        border-color: #e5a000;
        box-shadow: 0 0 0 2px #e5a000;
      }
      .hk-preview-chat .jspsych-multiplayer-reference-game-chat-log {
        border: 1px solid #ccc;
        border-radius: 6px;
      }
      .hk-preview-chat form {
        display: flex;
        gap: 10px;
      }
      .hk-preview-chat input {
        flex: 1;
        min-width: 0;
      }
      .hk-walkthrough [hidden] {
        display: none !important;
      }

      /* "Partner is typing…" hint from the plugin's `typing_indicator`. The original has one too
         (sharedUtils/clientBase.js sends `playerTyping` and shows "Other player is typing..."). */
      .jspsych-multiplayer-reference-game .jspsych-multiplayer-reference-game-typing-hint {
        min-height: 1.2em;
        margin-bottom: 0.3em;
        font-size: 0.9em;
        font-style: italic;
        color: #555;
        text-align: left;
      }
      .jspsych-multiplayer-reference-game .jspsych-multiplayer-reference-game-typing-hint[hidden] {
        display: block;
        visibility: hidden;
      }
    </style>
  </head>

  <body></body>
  <script>
    // ===============================================================================================
    // REFERENCE GAME: replication of Hawkins, Frank & Goodman (2020), "Characterizing the Dynamics of
    // Learning in Repeated Reference Games" (Cognitive Science 44, e12845), "sequential" condition.
    // Audited against the original source: OSF osf.io/vzvmf → hawkrobe/tangrams,
    // `experiments/tangrams_sequential` (the "cued" version).
    //
    // Matches the original:
    //   • 2 players with fixed director and matcher roles; 12 tangrams in a 6×2 grid of square cells.
    //   • One target per round; each tangram is the target once per block, in a fresh order each
    //     block (game.core.js `getRandomizedConditions`).
    //   • Each player's layout is reshuffled every round, and no tangram sits in the same cell for
    //     both players (`notMatchingLocs` / `arraysDifferent`): `scramble_mode: "disjoint"`.
    //   • Only the director sees the target. Chat is unrestricted in both directions, with a
    //     per-round log and a typing indicator (sharedUtils/clientBase.js `playerTyping`).
    //   • The matcher cannot click until the director has sent a message that round
    //     (game.client.js gates the click on `globalGame.messageSent`).
    //   • Feedback: director sees the matcher's pick (green either way); matcher sees the true
    //     target in green and, if they missed, their click in blue. The running score is the
    //     accuracy signal. 3000ms of feedback before the next round.
    //   • A round counter and running score shown throughout (`newRoundUpdate`).
    //
    // Differs from the original:
    //   1. 18 rounds instead of 72: three blocks of six targets, played without breaks. A shared
    //      shuffle selects six of the twelve tangrams per dyad; each is targeted once per block.
    //      All twelve tangrams remain visible on every trial.
    //   2. A 60s round limit. The original ran untimed. When it runs out the matcher's empty choice
    //      is submitted (`selection_timeout`), both players see a "Time's up" result for the usual
    //      feedback duration, and the game moves on. Timed-out rounds have
    //      `multiplayer_outcome: "timeout"`, `round_result: "timeout"` and an `idle_role`; they are
    //      never scored as incorrect and never end the game. Only a disconnection does.
    //   3. Gate semantics. The original sets `messageSent` on ANY chat message, including the
    //      matcher's own, so a matcher could unlock their click by typing. The plugin counts only the
    //      partner's message, which is the stricter reading and, judging by the source comment, the
    //      intended one.
    //   4. Short general instructions before the lobby, and a role recap after pairing.
    //      A comprehension check repeats with corrective feedback before the lobby. The page
    //      connects to the multiplayer session only after both, so nobody is paired while still
    //      reading.
    //   5. After the role recap, a role-specific walkthrough of the game screen, then two paired
    //      practice rounds on tangrams that are not targets in the dyad's main schedule. Practice
    //      rows are saved with `phase: "practice"` and never count toward the main game
    //      (WALKTHROUGH-PRACTICE.md).
    //
    // Key DVs, logged per round: message_count / messages_sent (a words-per-reference proxy),
    // correct, rt.
    // ===============================================================================================

    const MIN_PLAYERS = 2;

    const CONFIG = {
      PILOT_LABEL: "hawkins-18-trial-paid-pilot",
      BLOCKS: 3,
      TARGETS_PER_BLOCK: 6, // random subset per dyad; all 12 shapes remain visible
      COMPREHENSION_CHECK: true,
      // The role-specific walkthrough of the game screen after the role recap (hawkins-onboarding.js).
      INTERFACE_WALKTHROUGH: true,
      // Paired practice rounds before the main game, each on a tangram outside the dyad's main
      // schedule (so at most 12 - TARGETS_PER_BLOCK). 0 turns practice off.
      PRACTICE_ROUNDS: 2,
      // Replace these placeholders with real Prolific codes before the paid run. A placeholder
      // (Hawkins.PLACEHOLDER_CODES) is shown as a test code and lets a test run try the redirect, but
      // Prolific will not accept it, so scripts/make-jzip.mjs refuses to build the JATOS archive
      // while any code is empty or a placeholder (unless run with --allow-placeholder-codes).
      COMPLETION_CODES: {
        complete: "insertcodehere",
        partner_dropped: "insertcodehere", // partner left, or this participant's connection was lost
        no_match: "insertcodehere", // never got a partner
        reloaded: "insertcodehere", // this participant reloaded the page mid-session
      },
      PROLIFIC_SUBMIT_URL: "https://app.prolific.com/submissions/complete",
      NO_MATCH_PAYMENT_USD: 1.25,
      LOBBY_TIMEOUT_MS: 5 * 60000,
      PAIRING_TIMEOUT_MS: 30000,
      // How long each pair barrier waits for the partner to continue before giving up: after the
      // role recap and walkthrough (no-match exit) and, with practice, after the practice rounds
      // (partner-dropped exit). Without a barrier the faster reader would start a round (and its
      // 60s timer) alone while the partner is still reading, desyncing the two timelines. Long
      // enough for a slow reader to finish the walkthrough.
      READY_TIMEOUT_MS: 3 * 60000,
      // Round limit, as the matcher's `selection_timeout`: on expiry both players see feedback.
      ROUND_TIMEOUT_MS: 60000,
      // The timer panel shows a warning for this many seconds before ROUND_TIMEOUT_MS.
      TIMER_WARNING_SECONDS: 10,
      // Backstop `round_timeout` after the limit, for when the matcher's submission never arrives
      // (e.g. a frozen tab). That round ends without feedback, still as a timeout.
      ROUND_TIMEOUT_GRACE_MS: 5000,
      // "Are you still with us?" reminder during rounds (presence-check.js): shown after this long
      // with no activity, closed as missed if its button is not clicked in time. Never ends the game.
      PRESENCE_PROMPT_MS: 30000,
      PRESENCE_RESPONSE_MS: 15000,
      // How long a partner can be disconnected before they count as gone (core default: 10s).
      DROPOUT_TIMEOUT_MS: 30000,
      // How long this participant's own connection can stay down before the session gives up on it
      // and the round ends with "connection_lost". The core's default is to retry forever, which
      // leaves a JATOS participant whose channel the server closed stuck on "reconnecting".
      RECONNECT_GIVE_UP_MS: 60000,
      // Google Drive-backed DataPipe study created primarily for testing. It may also be used
      // for the main study; collaborators can create their own study and replace this ID.
      // Empty disables DataPipe; JATOS result data is still saved independently.
      // DataPipe runs only when the page is served by JATOS. A local run uploads nothing unless its
      // URL opts in with `?datapipe=1`, so dev and test runs stay out of the study's Drive folder.
      DATAPIPE_EXPERIMENT_ID: "wE2Zlitn0uhu",
      JATOS_SAVE_PER_ROUND: true,
      // How long the terminal screen says "Saving…" before telling the participant they can submit
      // while the upload finishes in the background. The exit message and submit controls appear
      // at once either way; this bounds only the status line.
      SAVE_STATUS_BUDGET_MS: 3000,
    };

    const onJatos = typeof jatos !== "undefined" && typeof jatos.onLoad === "function";
    const datapipeEnabled =
      Boolean(CONFIG.DATAPIPE_EXPERIMENT_ID) &&
      (onJatos || new URLSearchParams(location.search).get("datapipe") === "1");

    // Settles with the extension's final-save result. The extension makes that save after the
    // timeline ends and sets no timeout on it, so the terminal screen never waits for it (see
    // showTerminalScreen).
    let resolvePipeSave = null;
    const pipeSaved = datapipeEnabled
      ? new Promise((resolve) => { resolvePipeSave = resolve; })
      : Promise.resolve({ skipped: true });
    const jsPsych = initJsPsych({
      extensions: [{ type: jsPsychExtensionPresenceCheck }, {
        type: jsPsychExtensionPipe,
        params: {
          experiment_id: CONFIG.DATAPIPE_EXPERIMENT_ID,
          // An opaque filename keeps Prolific, participant, and dyad IDs out of DataPipe's staging
          // metadata; they remain in the saved trial rows. The extension resolves it once, at the
          // start. randomID, unlike the Web Crypto UUID API, also works outside a secure context.
          filename: () => `${jsPsych.randomization.randomID(32)}.json`,
          format: "json",
          enabled: datapipeEnabled,
          on_save: (result) => resolvePipeSave?.(result),
        },
      }],
    });

    const SHAPES = Tangrams.STIMULI; // 12 canonical tangrams (ids A–L, image src)
    // Built after connecting, from the session's shared randomness (see connectSession()).
    let SCHEDULE = [];
    let PRACTICE_SCHEDULE = [];

    // Identity, captured once connected. Every jsPsych row recorded while connected gets these
    // as multiplayer_participant_id and multiplayer_session_id.
    let participantId = null;
    let dyadId = null;

    // Prolific appends its IDs to the study link. On JATOS that link is the JATOS study link, and
    // the component page does not carry its query string; jatos.js keeps it instead.
    function studyLinkParams() {
      return onJatos
        ? new URLSearchParams(jatos.urlQueryParameters ?? {})
        : new URLSearchParams(location.search);
    }

    let prolific = { pid: null, study: null, session: null };

    jsPsych.data.addProperties({
      experiment_file: "reference-game-hawkins.html",
      study_variant: CONFIG.PILOT_LABEL,
      deployment: onJatos ? "jatos" : "local",
      config_blocks: CONFIG.BLOCKS,
      config_targets_per_block: CONFIG.TARGETS_PER_BLOCK,
      config_comprehension_check: CONFIG.COMPREHENSION_CHECK,
      config_interface_walkthrough: CONFIG.INTERFACE_WALKTHROUGH,
      config_practice_rounds: CONFIG.PRACTICE_ROUNDS,
      config_ready_timeout_ms: CONFIG.READY_TIMEOUT_MS,
      config_n_stimuli: SHAPES.length,
      config_round_timeout_ms: CONFIG.ROUND_TIMEOUT_MS,
      viewport_w: window.innerWidth,
      viewport_h: window.innerHeight,
      screen_w: window.screen?.width ?? null,
      screen_h: window.screen?.height ?? null,
      user_agent: navigator.userAgent,
    });

    (function warnOnUnsetConfig() {
      const unset = Object.entries(CONFIG.COMPLETION_CODES)
        .filter(([, v]) => !Hawkins.isRealCode(v))
        .map(([k]) => k);
      if (unset.length) console.warn(`Unset Prolific completion code(s): ${unset.join(", ")}`);
      if (!CONFIG.DATAPIPE_EXPERIMENT_ID) console.warn("DataPipe experiment ID is unset.");
      else if (!datapipeEnabled) console.info("DataPipe is off for this local run; add ?datapipe=1 to test it.");
    })();

    // ---- Session state --------------------------------------------------------------------------

    let myRole = null;
    let partnerId = null;
    let reloaded = false;
    let noMatchReason = null;
    // "partner_left" | "connection_lost" | "partner_not_ready_for_main"
    let interruption = null;
    let interruptedAtRound = null;
    let interruptedPhase = null; // "practice" | "main_ready" | "main"
    let outcome = null;

    // Main-game rounds only: practice rows (phase "practice") never count toward the main game's
    // progress, score, block count or completion.
    const completedRounds = () =>
      jsPsych.data.get().filter({ trial_type: "multiplayer-reference-game", phase: "main", multiplayer_outcome: "completed" });
    // Rounds that ran to their end, with a choice or a timeout; the game goes on after either.
    const playedRounds = (phase = "main") =>
      jsPsych.data
        .get()
        .filterCustom((t) => t.trial_type === "multiplayer-reference-game" && t.phase === phase &&
          (t.multiplayer_outcome === "completed" || t.multiplayer_outcome === "timeout"));

    function recordOutcome(exit) {
      if (outcome) return;
      const completed = completedRounds().count();
      const played = playedRounds().count();
      outcome = {
        ended_reason: exit,
        no_match_reason: noMatchReason,
        interrupted_at_round: interruptedAtRound,
        interrupted_phase: interruptedPhase,
        n_practice_played: playedRounds("practice").count(),
        n_trials_completed: completed,
        n_trials_timed_out: played - completed,
        n_trials_played: played,
        n_trials_scheduled: SCHEDULE.length,
        blocks_completed: Math.floor(played / CONFIG.TARGETS_PER_BLOCK),
      };
      jsPsych.data.addProperties(outcome);
    }

    // ---- Saving ---------------------------------------------------------------------------------

    const JatosSink = onJatos
      ? Hawkins.createJatosSink(jatos, () => jsPsych.data.get().json())
      : null;

    function saveProgress() {
      JatosSink?.submit();
    }

    // ---- Prolific -------------------------------------------------------------------------------

    const money = (usd) => `$${usd.toFixed(2)}`;

    function submissionBlockHTML(codeKey) {
      const code = CONFIG.COMPLETION_CODES[codeKey];
      if (!code) {
        return `<p style="color:#b00"><strong>Something has gone wrong on our end.</strong> The
                completion code for this exit
                (<code>${codeKey}</code>) is missing, so the automatic submission cannot run.</p>
                <p style="color:#b00">Please <strong>message the researcher from this study's page on
                Prolific</strong> and quote <code style="user-select:all">${codeKey}</code>. You will be
                paid, so do not return the study. Please keep this tab open until you have sent it.</p>`;
      }
      if (Hawkins.isPlaceholderCode(code)) {
        // A setup build: the button still tries the redirect, so a test run can check it.
        return `<div class="test-code-notice" style="border:2px dashed #b00;padding:0.5em 1em;margin:1em auto;max-width:36em">
                <p style="color:#b00"><strong>Test build: this is a placeholder completion code, not a
                real one.</strong> Prolific will not accept <code>${code}</code>.</p>
                <p>If you are taking part in the study, please <strong>message the researcher from this
                study's page on Prolific</strong> and quote <code style="user-select:all">${codeKey}</code>.
                You will be paid, so do not return the study.</p>
                <p><button id="prolific-submit" type="button">Test the return to Prolific</button></p>
                </div>`;
      }
      return `<p><button id="prolific-submit" type="button">Submit and return to Prolific</button></p>
              <p style="font-size:0.9em">If that button does not work, your completion code is
              <code style="user-select:all">${code}</code>. Paste it into Prolific to submit.</p>`;
    }

    function submitToProlific(codeKey, successful) {
      const code = CONFIG.COMPLETION_CODES[codeKey];
      if (!code) return;
      const url = `${CONFIG.PROLIFIC_SUBMIT_URL}?cc=${encodeURIComponent(code)}`;
      if (onJatos) {
        // Finishes the JATOS study result, with the final data, before leaving for Prolific.
        jatos.endStudyAndRedirect(url, jsPsych.data.get().json(), successful);
      } else {
        window.location.href = url;
      }
    }

    // ---- Timeline -------------------------------------------------------------------------------

    // The 12 tangrams are real PNGs, and rt is a DV. `stimuli` is an object parameter, so jsPsych's
    // automatic preloading cannot find the `src` values; list them here. Runs before the waiting
    // room, so nobody is still loading images while their partner waits.
    const preloadTrial = {
      type: jsPsychPreload,
      images: SHAPES.map((s) => s.src),
      message: "<p>Loading…</p>",
    };

    // One Continue button; same pattern as the waiting room (no extra jsPsych plugin).
    function continueScreen(html, data) {
      return {
        type: jsPsychCallFunction,
        async: true,
        func: (done) => {
          jsPsych.getDisplayElement().innerHTML = `
            <div style="max-width: 40em; margin: 2em auto; text-align: center; line-height: 1.45;">
              ${html}
              <p style="margin-top: 1.5em; text-align: center;">
                <button type="button" id="continue-instructions">Continue</button>
              </p>
            </div>`;
          document.getElementById("continue-instructions").addEventListener("click", () => done(data));
        },
      };
    }

    const totalRounds = CONFIG.BLOCKS * CONFIG.TARGETS_PER_BLOCK;
    const roundSeconds = Math.round(CONFIG.ROUND_TIMEOUT_MS / 1000);
    const generalInstructions = continueScreen(
      `<h2>How this study works</h2>
       <p>You'll be paired with another participant for a real-time task. One of you will be the
          <strong>Director</strong> and the other will be the <strong>Matcher</strong> (assigned at
          random, and fixed for the whole game).</p>
       <p><strong>Goal:</strong> The Director sees one highlighted shape in a lineup of ${SHAPES.length}
          abstract shapes (tangrams) and describes it in the chat. The Matcher, who can't see the
          highlight, tries to click that shape.</p>
       <p><strong>Each round:</strong></p>
       <ul style="text-align: left; display: inline-block; margin: 0 auto;">
         <li>The target is outlined in yellow, but only on the Director's screen.</li>
         <li>Both of you can chat freely (chat box below the shapes), but the Director must send
             at least one message before the Matcher can choose.</li>
         <li>The shapes are arranged differently on your two screens. Describe the shape itself,
             rather than its position.</li>
         <li>You have ${roundSeconds} seconds to describe and pick a tangram. A countdown on every
             trial shows the time remaining and warns you in the last
             ${CONFIG.TIMER_WARNING_SECONDS} seconds. If time runs out before the Matcher picks, you
             both see a "Time's up" message (the Matcher also sees the correct shape), then move on
             to the next trial.</li>
         <li>If you're inactive for a while, a message will ask you to click a button to show
             you're still with us.</li>
         <li>After the choice, you both see "Correct!" or "Incorrect." The correct shape is outlined
             in green on the Matcher's screen. If the Matcher picked a different one, their pick is
             outlined in blue.</li>
       </ul>
       <p>${CONFIG.PRACTICE_ROUNDS
         ? `After you're paired, we'll show you the game screen, and you'll play
            ${CONFIG.PRACTICE_ROUNDS} practice rounds together. Then the main game has
            ${totalRounds} trials, with no breaks. Practice doesn't count toward your score.`
         : `There are ${totalRounds} trials, with no breaks.`}</p>
       <p>${CONFIG.COMPREHENSION_CHECK ? "Next, answer three quick questions about the task. Then you" : "Next you"}
          will wait to be paired with a partner.</p>`,
      { instruction_screen: "general" },
    );

    // Use the existing call-function plugin so this check adds no browser dependencies.
    // Keep the pass flag explicitly: feedback also creates a row, so last(1) is not the answer row.
    let comprehensionPassed = false;
    let comprehensionAttempt = 0;
    const comprehensionQuestions = [
      {
        name: "target_visibility",
        title: "Who sees the yellow target highlight during a round?",
        choices: ["Both participants", "Only the Director", "Only the Matcher"],
        answer: "Only the Director",
        explanation: "Only the Director sees the yellow target highlight. The Matcher uses the Director's description.",
      },
      {
        name: "click_gate",
        title: "When can the Matcher click a shape?",
        choices: ["As soon as the round starts", "After the Matcher sends a message in this round", "After the Director sends a message in this round"],
        answer: "After the Director sends a message in this round",
        explanation: "The Director must send at least one message each round before the Matcher can click. Both participants may ask questions or chat throughout.",
      },
      {
        name: "layout",
        title: "How should the Director identify the target to the Matcher?",
        choices: ["Describe what the shape looks like", "Give its position on the Director's screen", "Tell the Matcher to choose the yellow shape"],
        answer: "Describe what the shape looks like",
        explanation: "The layouts differ between screens, and the Matcher cannot see the yellow highlight. Describe the shape itself rather than its position.",
      },
    ];
    const comprehensionLoop = {
      timeline: [
        {
          type: jsPsychCallFunction,
          async: true,
          func: (done) => {
            const startedAt = performance.now();
            comprehensionAttempt += 1;
            const display = jsPsych.getDisplayElement();
            display.innerHTML = `<form id="comprehension-form" style="max-width:40em;margin:2em auto;text-align:left;line-height:1.5">
              <h2>Check your understanding</h2>
              <p>Please answer all three questions. If you miss one, we'll explain it and you can try again.</p>
              ${comprehensionQuestions.map((q) => `<fieldset style="margin:1em 0"><legend>${q.title}</legend>
                ${jsPsych.randomization.shuffle(q.choices).map((choice) => `<label style="display:block;padding:0.3em">
                  <input type="radio" name="${q.name}" value="${q.choices.indexOf(choice)}" required> ${choice}</label>`).join("")}
              </fieldset>`).join("")}
              <button type="submit">Check answers</button></form>`;
            display.querySelector("form").addEventListener("submit", (event) => {
              event.preventDefault();
              const form = new FormData(event.currentTarget);
              const response = Object.fromEntries(comprehensionQuestions.map((q) =>
                [q.name, q.choices[Number(form.get(q.name))]],
              ));
              const incorrect = comprehensionQuestions.filter((q) => response[q.name] !== q.answer);
              comprehensionPassed = incorrect.length === 0;
              done({ instruction_screen: "comprehension", comprehension_attempt: comprehensionAttempt,
                comprehension_passed: comprehensionPassed, response,
                incorrect_questions: incorrect.map((q) => q.name), rt: performance.now() - startedAt });
            }, { once: true });
          },
          on_finish: () => saveProgress(`comprehension-${comprehensionAttempt}`),
        },
        {
          type: jsPsychCallFunction,
          async: true,
          func: (done) => {
            const feedback = comprehensionPassed
              ? "<h2>Correct!</h2><p>You're ready to wait for a partner.</p>"
              : `<h2>Please try again</h2><p>One or more answers were incorrect. Please remember:</p>
                 <ul style="text-align:left">${comprehensionQuestions.map((q) => `<li>${q.explanation}</li>`).join("")}</ul>`;
            continueScreen(feedback, { instruction_screen: "comprehension_feedback",
              comprehension_attempt: comprehensionAttempt, comprehension_passed: comprehensionPassed }).func(done);
          },
        },
      ],
      conditional_function: () => CONFIG.COMPREHENSION_CHECK,
      loop_function: () => !comprehensionPassed,
    };

    const connectedCount = (presence) =>
      Object.values(presence).filter((status) => status === "connected").length;

    // Holds the participant until they have a partner.
    //   JATOS: JATOS fills groups up to the batch's Max active members (which must be 2) and the
    //          adapter seals the group when it is full, so waitForGroup() resolves with the final
    //          roster. Nobody can join a sealed group, so a late arrival starts a new one.
    //   Local: one link per dyad (`?mp_session=`), and a local group is never sealed, so wait until
    //          two tabs are connected. Open exactly two tabs per session.
    let lobbyTicker = null;
    const waitingTrial = {
      type: jsPsychCallFunction,
      async: true,
      func: (done) => {
        const deadline = Date.now() + CONFIG.LOBBY_TIMEOUT_MS;
        jsPsych.getDisplayElement().innerHTML = `
          <p>Waiting for a partner to join…</p>
          <p>This study is played in pairs, so we need to match you with someone before we can
             start. Most people are matched quickly.</p>
          <p><strong>Time remaining: <span id="lobby-remaining">—</span></strong></p>
          <p style="font-size:0.9em;color:#555">If we cannot find you a partner in time, we will end
             the study and <strong>still pay you ${money(CONFIG.NO_MATCH_PAYMENT_USD)}</strong> for
             waiting. You do not need to do anything.</p>
          ${onJatos ? "" : `<p style="font-size:0.85em;color:#888">Testing locally? Open this page in
             one other tab, keeping the <code>?mp_session=</code> in the URL.</p>`}`;
        const el = document.getElementById("lobby-remaining");
        const tick = () => {
          const left = Math.max(0, deadline - Date.now());
          const m = Math.floor(left / 60000);
          const s = Math.floor((left % 60000) / 1000);
          el.textContent = left < 1000 ? "finishing up…" : `${m}:${String(s).padStart(2, "0")}`;
        };
        tick();
        lobbyTicker = setInterval(tick, 1000);
        const finish = (data) => {
          clearInterval(lobbyTicker);
          done(data);
        };

        if (onJatos && jsPsych.multiplayer.group().size !== MIN_PLAYERS) {
          // Without a limit of 2, JATOS puts everyone in one group and it never seals.
          console.error(
            `The JATOS batch's "Max active members" must be ${MIN_PLAYERS}; it is ` +
              `${jsPsych.multiplayer.group().size}.`,
          );
          noMatchReason = "batch_misconfigured";
          finish({ waiting_room: noMatchReason });
          return;
        }

        const matched = onJatos
          ? jsPsych.multiplayer.waitForGroup({ timeout: CONFIG.LOBBY_TIMEOUT_MS })
          : jsPsych.multiplayer.wait((data, presence) => connectedCount(presence) >= MIN_PLAYERS, {
              timeout: CONFIG.LOBBY_TIMEOUT_MS,
            });
        matched.then(
          () =>
            finish({
              waiting_room: "matched",
              group_members: jsPsych.multiplayer.group().members,
              waited_ms: CONFIG.LOBBY_TIMEOUT_MS - (deadline - Date.now()),
            }),
          (error) => {
            const timedOut = error?.name === "MultiplayerError" && error.code === "timeout";
            noMatchReason = timedOut ? "lobby_timeout" : "lobby_error";
            if (!timedOut) console.error("Waiting room failed", error);
            finish({ waiting_room: noMatchReason, waiting_room_error: error?.code ?? String(error) });
          },
        );
      },
    };

    const waitingRoom = {
      timeline: [waitingTrial],
      conditional_function: () => !noMatchReason && !reloaded,
    };

    // Fixed director/matcher for the whole game, drawn from the session's shared randomness, so
    // both players compute the same assignment without a coordinator. On JATOS `group_size: null`
    // means the sealed group; locally it must be stated.
    const roleTrial = {
      type: jsPsychMultiplayerRole,
      roles: ["director", "matcher"],
      strategy: "random",
      group_size: onJatos ? null : MIN_PLAYERS,
      timeout: CONFIG.PAIRING_TIMEOUT_MS,
      save_group: true,
      message: "<p>Pairing you with your partner…</p>",
      on_finish: (data) => {
        myRole = jsPsychMultiplayerRole.getMyRole();
        const byRole = jsPsychMultiplayerRole.participantsByRole();
        partnerId = myRole === "director" ? byRole.matcher?.[0] : byRole.director?.[0];
        if (data.multiplayer_outcome === "participant_left") noMatchReason = "partner_left_before_start";
        else if (myRole !== "director" && myRole !== "matcher") noMatchReason = "pairing_timeout";
        else document.body.dataset.role = myRole;
      },
    };

    const pairingPhase = {
      timeline: [roleTrial],
      conditional_function: () => !noMatchReason && !reloaded,
    };

    const roleRecap = {
      timeline: [
        {
          type: jsPsychCallFunction,
          async: true,
          func: (done) => {
            const directorCopy = `
              <h2>You are the Director</h2>
              <p>Each round, one tangram (an abstract shape) is outlined in <strong>yellow</strong> on
                 your screen. <strong>Only you can see it</strong> — your partner can't. Describe that
                 shape so your partner can pick it out of the lineup of ${SHAPES.length}.</p>
              <p>Use the <strong>chat box below the shapes</strong>. You <strong>must send at least one
                 message every round</strong> — your partner can't click until you do.</p>
              <p>After each choice you'll see your partner's pick outlined in green. Green on your
                 screen marks their pick, not necessarily the right answer. The message above the
                 shapes says <strong>Correct!</strong> or <strong>Incorrect.</strong></p>
              <p>You will stay the <strong>Director for the whole game</strong>.
                 Roles do not switch.</p>`;
            const matcherCopy = `
              <h2>You are the Matcher</h2>
              <p>You will see ${SHAPES.length} tangrams (abstract shapes). The Director sees one of them
                 outlined in <strong>yellow</strong>, but that highlight appears <strong>only on their
                 screen</strong>, so go by their description to <strong>click the one</strong> you think
                 they mean.</p>
              <p>If clicking does nothing at first, that's expected. The shapes unlock as soon as the
                 Director sends a message (they must send at least one every round). You can use the
                 <strong>chat box below the shapes</strong> throughout, including asking questions if a
                 description is unclear.</p>
              <p>After you choose, a <strong>green</strong> outline marks the correct shape. If you picked
                 a different one, your click is marked in <strong>blue</strong>.</p>
              <p>You will stay the <strong>Matcher for the whole game</strong>.
                 Roles do not switch.</p>`;
            jsPsych.getDisplayElement().innerHTML = `
              <div style="max-width: 40em; margin: 2em auto; text-align: center; line-height: 1.45;">
                ${myRole === "director" ? directorCopy : matcherCopy}
                <p style="margin-top: 1.5em; text-align: center;">
                  <button type="button" id="continue-instructions">Continue</button>
                </p>
              </div>`;
            document
              .getElementById("continue-instructions")
              .addEventListener("click", () =>
                done({ instruction_screen: "role_recap", recap_role: myRole }),
              );
          },
        },
      ],
      conditional_function: () =>
        (myRole === "director" || myRole === "matcher") && !noMatchReason,
    };

    // Role-specific walkthrough of the game screen (hawkins-onboarding.js), after the recap and
    // before the ready barrier, so each partner reads at their own pace and the barrier then lines
    // the pair up. The Director's preview outlines the first practice target, which is never a
    // main-game target.
    const interfaceWalkthrough = {
      timeline: [
        {
          type: jsPsychCallFunction,
          async: true,
          func: (done) =>
            HawkinsOnboarding.walkthrough(jsPsych.getDisplayElement(), {
              role: myRole,
              shapes: SHAPES,
              target:
                PRACTICE_SCHEDULE[0]?.targets[0] ??
                SHAPES.find((s) => !SCHEDULE.some((t) => t.targets[0] === s.id))?.id ??
                SHAPES[0].id,
              seconds: roundSeconds,
              practiceRounds: PRACTICE_SCHEDULE.length,
              mainRounds: SCHEDULE.length,
            }, done),
          on_finish: () => saveProgress(),
        },
      ],
      conditional_function: () =>
        CONFIG.INTERFACE_WALKTHROUGH && (myRole === "director" || myRole === "matcher") && !noMatchReason,
    };

    // A pair barrier (Hawkins.waitForPair) as a trial: both partners continue together, or the
    // wait ends on the partner leaving or on READY_TIMEOUT_MS. While it waits, the screen says
    // whether the partner is still reading or seems to have lost their connection. `copy` holds
    // the heading, the two waiting messages and the note on the time limit; `onResult(result)`
    // routes a failure and returns the row's fields.
    const readyMinutes = Math.round(CONFIG.READY_TIMEOUT_MS / 60000);
    function pairBarrierTrial(flag, copy, onResult) {
      return {
        type: jsPsychCallFunction,
        async: true,
        func: (done) => {
          const display = jsPsych.getDisplayElement();
          display.innerHTML = `
            <div class="hk-barrier" style="max-width: 36em; margin: 2em auto; line-height: 1.45;">
              <p><strong>${copy.heading}</strong></p>
              <p class="hk-barrier-status" aria-live="polite">Waiting for your partner…</p>
              <p style="font-size:0.9em;color:#555">${copy.limit}</p>
            </div>`;
          const status = display.querySelector(".hk-barrier-status");
          Hawkins.waitForPair(jsPsych.multiplayer, {
            self: participantId,
            partner: partnerId,
            flag,
            timeoutMs: CONFIG.READY_TIMEOUT_MS,
            onWaiting: (state) => {
              // Only on a change, so the live region is not re-announced every poll.
              if (status && status.textContent !== copy[state]) status.textContent = copy[state];
            },
          }, ({ result, wait_ms }) => done({ ...onResult(result), ready_wait_ms: wait_ms }));
        },
      };
    }

    // Ready barrier before the first round: nobody starts a round (and its 60s timer) while the
    // partner is still reading the recap or the walkthrough. A failure here is a no-match exit,
    // as it was before practice existed.
    const readyTrial = pairBarrierTrial("ready", {
      heading: "Waiting for your partner to be ready…",
      partner_not_ready:
        "Your partner is still reading the instructions. The game will start as soon as they're done.",
      partner_disconnected:
        "Your partner seems to have lost their connection. We're waiting for them to come back.",
      limit: `If the game can't start within ${readyMinutes} minutes, we'll end the study and still pay
        you ${money(CONFIG.NO_MATCH_PAYMENT_USD)} for your time.`,
    }, (result) => {
      const waiting_ready = {
        matched: "matched",
        partner_left: "partner_left_before_start",
        timeout: "partner_not_ready",
      }[result];
      if (waiting_ready !== "matched") noMatchReason = waiting_ready;
      return { waiting_ready };
    });

    // jsPsych evaluates conditional_function on timeline nodes, not plugin trials.
    // Skip readiness after failed pairing so its timeout cannot replace the original reason.
    const readyBarrier = {
      timeline: [readyTrial],
      conditional_function: () =>
        (myRole === "director" || myRole === "matcher") && !noMatchReason,
    };

    // True while the current round shows feedback. The plugin enters feedback when the matcher's
    // submission reaches the round's shared data (Hawkins.roundHasSubmission), on both clients and
    // whether or not it renders any feedback text, so read that rather than the feedback DOM. Outside
    // a trial, or once the session has closed, the read throws and this is false.
    function inFeedbackPhase() {
      return roundSubmissionNow() !== null;
    }

    // The matcher's submitted choice for the current round (`timed_out: true` when the
    // selection_timeout made it), or null before feedback and outside a trial.
    function roundSubmissionNow() {
      try {
        return Hawkins.roundSubmission(jsPsych.multiplayer.getAll({ scope: "trial" }));
      } catch {
        return null;
      }
    }

    let roundCountdownInterval = null;
    // Shares, and on the director receives, how many director messages had reached the matcher by
    // the deadline (Hawkins.createDeadlineWitness). Replaced every round in on_load.
    let deadlineWitness = null;
    const gameRound = {
      type: jsPsychMultiplayerReferenceGame,
      stimuli: SHAPES,
      columns: 6, // 6×2 grid, as in the original
      cell_size: 130, // square cells, like the original's 300px ones (see the <style> block)
      role: () => myRole,
      partner_id: () => partnerId,
      round: jsPsych.timelineVariable("round"),
      targets: jsPsych.timelineVariable("targets"), // one target, one click
      // Which part of the game this round belongs to ("practice" or "main"), and its zero-based
      // index within that part. Main rounds keep `round` 0..17; practice rounds have negative ones
      // (Hawkins.phaseSchedules).
      data: { phase: jsPsych.timelineVariable("phase"), phase_round: jsPsych.timelineVariable("phase_round") },
      scramble_mode: "disjoint",
      reveal_target_to: "director",
      // Unrestricted chat both ways. These are the defaults, stated because the effect depends on them.
      chat_role: "both",
      chat_autofocus: () => myRole === "director",
      // After the Director clicks elsewhere mid-round, typing still goes into the chat box.
      chat_type_to_focus: () => myRole === "director",
      max_messages: null,
      max_length: null,
      require_message_before_response: true,
      typing_indicator: true, // plugin defaults (2500ms TTL, 800ms throttle) match the original
      // The round counter and score are in `prompt`, shown throughout, as in the original.
      show_running_score: false,
      feedback_content: {
        director: { reveal_target: false, show_score: false, show_partner_choice: true },
        matcher: { reveal_target: true, show_score: false, show_partner_choice: true },
      },
      feedback_duration: 3000,
      // The matcher's timer submits the (empty) choice so both players reach feedback together.
      selection_timeout: CONFIG.ROUND_TIMEOUT_MS,
      round_timeout: CONFIG.ROUND_TIMEOUT_MS + CONFIG.ROUND_TIMEOUT_GRACE_MS,
      // A partner who leaves ends the round with multiplayer_outcome: "participant_left".
      end_on_participant_left: true,
      // Suppressed once feedback starts (inFeedbackPhase), so it never covers the round's result.
      extensions: [{
        type: jsPsychExtensionPresenceCheck,
        params: {
          prompt_after: CONFIG.PRESENCE_PROMPT_MS,
          respond_within: CONFIG.PRESENCE_RESPONSE_MS,
          paused: () => inFeedbackPhase(),
        },
      }],
      save_interaction_history: true,
      // Instruction wording from the original (game.client.js `client_onjoingame`), with one fix:
      // the original tells both roles they may "talk to the director", a copy-paste slip, so the
      // director's copy names the matcher.
      prompt: (role) => {
        // Progress and score count this phase's rounds only, so both start again from zero for the
        // main game after practice.
        const phase = jsPsych.evaluateTimelineVariable("phase");
        const finished = jsPsych.data.get().filter({ trial_type: "multiplayer-reference-game", phase });
        const score = finished.filter({ correct: true }).count();
        // The original's round number advances on every round, whatever the outcome.
        const roundNum = finished.count() + 1;
        // Separate progress, score and timer panels (hawkins-ui.js), then the round's result line.
        const header = HawkinsUI.header({
          round: roundNum,
          total: phase === "practice" ? PRACTICE_SCHEDULE.length : SCHEDULE.length,
          score,
          seconds: roundSeconds,
          phase,
        });
        const director =
          "Send messages to help the matcher pick the target image." +
          " You are free to use the chatbox to talk to the matcher at any time.";
        const matcher =
          "Select the correct target out of the lineup." +
          " You are free to use the chatbox to talk to the director at any time.";
        return role === "director"
          ? `${header}<p><strong>You are the Director.</strong> ${director}</p>`
          : `${header}<p><strong>You are the Matcher.</strong> ${matcher}</p>`;
      },
      on_load: () => {
        // The plugin starts its wall-clock timers during synchronous trial setup, just before
        // jsPsych calls on_load. Stop this display when feedback begins (inFeedbackPhase) or the
        // trial ends. A submission the selection_timeout made carries `timed_out: true`.
        const display = jsPsych.getDisplayElement();
        HawkinsUI.chat(display, myRole);
        const remaining = document.getElementById("round-remaining");
        const deadline = Date.now() + CONFIG.ROUND_TIMEOUT_MS;
        // The result shown is scored from the submitted assignment against this round's targets, as
        // the saved row is (Hawkins.submissionResult), never from the matcher's reported n_correct.
        const targets = jsPsych.evaluateTimelineVariable("targets");
        const witness = Hawkins.createDeadlineWitness(myRole, participantId, partnerId);
        deadlineWitness = witness;
        try {
          // Ends with the trial. On the matcher, the callback runs in the same update that delivers
          // its submission and starts its feedback, so the count is what the matcher had received.
          jsPsych.multiplayer.subscribe((group) => {
            const count = witness.observe(group);
            if (count === null) return;
            Promise.resolve()
              .then(() => jsPsych.multiplayer.update({ [Hawkins.DEADLINE_COUNT_KEY]: count }, { scope: "trial" }))
              .catch(() => {}); // a closed session ends the round anyway
          }, { scope: "trial" });
        } catch (error) {
          console.error("Could not watch the round's shared data", error);
        }
        const showTimeoutNote = () => {
          // Who didn't act: the matcher's shared count once known, else this side's own view.
          let described = witness.count;
          if (described === null) {
            const own = document.querySelectorAll(".jspsych-multiplayer-reference-game-chat-message.is-self").length;
            const all = document.querySelectorAll(".jspsych-multiplayer-reference-game-chat-message").length;
            described = myRole === "director" ? own : all - own;
          }
          const cause = described > 0
            ? "The Matcher didn't pick a shape this round."
            : "The Director didn't send a description this round.";
          HawkinsUI.result(display, "timeout", myRole === "matcher"
            ? `Time's up! ${cause} The correct shape is outlined in green.`
            : `Time's up! ${cause}`);
          return witness.count !== null;
        };
        const update = () => {
          const result = Hawkins.submissionResult(roundSubmissionNow(), targets);
          // The warning follows the same deadline as the countdown and stops with the round.
          const seconds = Math.max(0, Math.ceil((deadline - Date.now()) / 1000));
          HawkinsUI.timer(display, seconds, CONFIG.TIMER_WARNING_SECONDS, result === null);
          if (result === null) {
            remaining.textContent = `${seconds}s`;
          } else if (result !== "timeout") {
            remaining.textContent = "Selection complete";
            // The score panel becomes the saved count plus this round, if it was correct.
            HawkinsUI.result(display, result);
            clearInterval(countdownInterval);
          } else {
            remaining.textContent = "Time's up";
            // Keep refreshing the note until the matcher's count arrives (at once on the matcher).
            if (showTimeoutNote()) clearInterval(countdownInterval);
          }
        };
        const countdownInterval = window.setInterval(update, 200);
        update();
        roundCountdownInterval = countdownInterval;
      },
      on_finish: (data) => {
        clearInterval(roundCountdownInterval);
        roundCountdownInterval = null;
        // feedback_shown and timeout_source come from the plugin's data (see classifyRound), not
        // from the display poll above, which a throttled background tab can miss.
        Object.assign(data, Hawkins.classifyRound(data, {
          directorMessagesByDeadline: deadlineWitness?.count ?? null,
        }));
        deadlineWitness = null;
        if (CONFIG.JATOS_SAVE_PER_ROUND) saveProgress();

        // Timeouts never end the game; only a disconnection does.
        if (data.multiplayer_outcome === "participant_left") interruption = "partner_left";
        else if (data.multiplayer_outcome === "connection_lost") interruption = "connection_lost";
        if (interruption) {
          interruptedAtRound = data.round;
          interruptedPhase = data.phase;
          jsPsych.abortCurrentTimeline();
        }
      },
    };

    // Practice: the same round as the main game (roles, message gate, timer, presence check,
    // feedback), on PRACTICE_SCHEDULE. An interruption here skips everything up to the terminal
    // screen.
    const practiceLoop = {
      timeline: [gameRound],
      timeline_variables: PRACTICE_SCHEDULE, // replaced in connectSession(), once the schedule exists
      conditional_function: () => CONFIG.PRACTICE_ROUNDS > 0 && !noMatchReason && !reloaded && !interruption,
    };

    const mainTransition = {
      timeline: [
        continueScreen(
          `<h2>Practice is over. The main game is next.</h2>
           <p>You'll play ${totalRounds} trials together, in the same roles, with no breaks.</p>
           <p>Progress and the number correct start again from zero.</p>
           <p>When you continue, the main game starts as soon as your partner continues too.</p>`,
          { instruction_screen: "main_transition" },
        ),
      ],
      conditional_function: () => CONFIG.PRACTICE_ROUNDS > 0 && !noMatchReason && !reloaded && !interruption,
    };

    // The second pair barrier, before the main game. Its own flag, so the earlier `ready` flags can
    // never release it. The pair has played together by now, so a failure here is a partner-dropped
    // exit (Hawkins.exitFor): partner_left if the partner has left, or a neutral
    // partner_not_ready_for_main if the time runs out.
    const mainReadyTrial = pairBarrierTrial("ready_for_main", {
      heading: "Waiting for your partner to start the main game…",
      partner_not_ready:
        "Your partner is still reading. The main game will start as soon as they continue.",
      partner_disconnected:
        "Your partner seems to have lost their connection. We're waiting for them to come back.",
      limit: `If the main game can't start within ${readyMinutes} minutes, we'll end the study here.
        Your payment is not affected.`,
    }, (result) => {
      if (result === "partner_left") interruption = "partner_left";
      else if (result === "timeout") interruption = "partner_not_ready_for_main";
      if (interruption) interruptedPhase = "main_ready";
      return { waiting_ready_for_main: result };
    });
    mainReadyTrial.on_finish = () => saveProgress();

    const mainReadyBarrier = {
      timeline: [mainReadyTrial],
      conditional_function: () => CONFIG.PRACTICE_ROUNDS > 0 && !noMatchReason && !reloaded && !interruption,
    };

    const gameLoop = {
      timeline: [gameRound],
      timeline_variables: SCHEDULE, // replaced in connectSession(), once the schedule exists
      conditional_function: () => !noMatchReason && !reloaded && !interruption,
    };

    // ---- Terminal screen ------------------------------------------------------------------------

    function exitMessage(exit) {
      const played = playedRounds().count();
      // Practice rounds are not main-game rounds, so an exit before the main game says that
      // rather than "0 of 18".
      const progress = played === 0 && (interruptedPhase === "practice" || interruptedPhase === "main_ready")
        ? `<p>This happened before the main game started.</p>`
        : `<p>You completed ${played} of ${SCHEDULE.length} rounds together.</p>`;
      switch (exit) {
        case "reloaded":
          return `<h2>This page was reloaded</h2>
            <p>The game carried on without this page, so it can't be rejoined.
               <strong>You will still be paid for the time you spent.</strong></p>`;
        case "no_match":
          return `<h2>We could not match you with a partner</h2>
            ${
              noMatchReason === "lobby_timeout"
                ? `<p>We could not find you a partner in the time available. This happens when not
                     enough people are online at the same moment. It is nothing to do with you.</p>`
                : noMatchReason === "partner_left_before_start"
                ? `<p>Your partner left before the game could start. It is nothing to do with you.</p>`
                : noMatchReason === "partner_not_ready"
                ? `<p>We couldn't start the game together. Your partner may have left or had connection
                     trouble — either way, it is nothing to do with you.</p>`
                : `<p>Something went wrong on our end before the game could start. It is nothing to
                     do with you.</p>`
            }
            <p><strong>You will still be paid ${money(CONFIG.NO_MATCH_PAYMENT_USD)} for your
               time.</strong></p>`;
        case "partner_left":
          return `<h2>Your partner stopped responding</h2>
            <p>Your partner disconnected, so we have ended the study here.
               <strong>This is not your fault, and your payment is not affected.</strong></p>
            ${progress}`;
        case "connection_lost":
          return `<h2>We lost the connection to the game</h2>
            <p>Your connection to the game server dropped and did not come back, so we have ended
               the study here. <strong>Your payment is not affected.</strong></p>
            ${progress}`;
        case "partner_not_ready_for_main":
          return `<h2>We couldn't start the main game together</h2>
            <p>Your partner didn't continue to the main game in time, so we have ended the study
               here. They may have left or had connection trouble. Either way, it is nothing to do
               with you. <strong>Your payment is not affected.</strong></p>
            ${progress}`;
        case "complete": {
          const correct = completedRounds().filter({ correct: true }).count();
          return `<h2>Game complete!</h2>
            <p>Together you got <strong>${correct} of ${played}</strong> round${
              played === 1 ? "" : "s"
            } correct.</p>
            <p>Thank you. Please submit to complete the study.</p>`;
        }
      }
      throw new Error(`No message for exit "${exit}"`);
    }

    function showSaveStatus(result) {
      const el = document.getElementById("save-status");
      if (!el) return;
      el.textContent = result.skipped
        ? "Nothing was uploaded: DataPipe is off for local runs (add ?datapipe=1 to test it)."
        : result.ok
        ? "Your responses have been saved."
        : result.timedOut
        ? "Still uploading. You can submit now; the upload will finish in the background."
        : "The final upload was not accepted. Please submit anyway and message the researcher.";
    }

    // The terminal screen shows the exit message and the submit controls at once, and never waits
    // on a save. It renders beside jsPsych's display element, which it hides: once the timeline
    // ends, the Pipe extension writes its "Saving data" message into that element and then awaits
    // Firebase and pipe.jspsych.org with no timeout, which on a lost connection can be forever.
    // The status line follows the saves and gives up waiting after SAVE_STATUS_BUDGET_MS.
    function showTerminalScreen(exit, codeKey) {
      const display = jsPsych.getDisplayElement();
      const screen = document.createElement("div");
      screen.id = "terminal-screen";
      screen.className = "jspsych-content";
      screen.innerHTML = `${exitMessage(exit)}
        <p id="save-status" style="font-size:0.9em;color:#666">Saving your responses…</p>
        ${submissionBlockHTML(codeKey)}
        ${onJatos ? "" : `<p style="font-size:0.85em;color:#666">Researcher tools:
          <button id="dl" type="button">Download data (JSON)</button></p>`}`;
      display.style.display = "none";
      display.after(screen);
      document.getElementById("prolific-submit")?.addEventListener("click", () =>
        submitToProlific(codeKey, exit === "complete"),
      );
      document.getElementById("dl")?.addEventListener("click", () =>
        jsPsych.data.get().localSave("json", "reference-game-hawkins-data.json"),
      );

      let settled = false;
      const budget = setTimeout(() => {
        if (!settled) showSaveStatus({ ok: false, timedOut: true });
      }, CONFIG.SAVE_STATUS_BUDGET_MS);
      Promise.all([JatosSink ? JatosSink.submit() : { skipped: true }, pipeSaved]).then((results) => {
        settled = true;
        clearTimeout(budget);
        showSaveStatus(Hawkins.combineSaveResults(results));
      });
    }

    // The last trial: it records the outcome, so the extension's final save (which starts when the
    // timeline ends) includes it, and puts up the terminal screen.
    const terminalScreen = {
      type: jsPsychCallFunction,
      func: () => {
        const { exit, codeKey } = Hawkins.exitFor({ reloaded, noMatchReason, interruption });
        recordOutcome(exit);
        // Leave the group, so a partner still waiting sees this participant as gone. There is no
        // session to leave when connect() failed.
        if (jsPsych.multiplayer.status) jsPsych.multiplayer.disconnect();
        showTerminalScreen(exit, codeKey);
        return exit;
      },
    };

    // ---- Connecting -----------------------------------------------------------------------------

    function adapter() {
      return onJatos
        ? new jsPsychAdapterMultiplayerJatos()
        : // Keeps a reloaded tab's participant ID (persistParticipant, on by default), so the reload
          // is detected as a restart instead of the tab joining as a third participant.
          new jsPsychAdapterMultiplayerLocal();
    }

    // Set once this tab has joined a session. A reload then skips the instructions and quiz it has
    // already passed, so a participant who reloads mid-game reaches the reload exit straight away.
    const CONNECTED_KEY = "hawkins-connected";
    let resumed = false;
    try {
      resumed = sessionStorage.getItem(CONNECTED_KEY) === "1";
    } catch {
      // Storage unavailable: a reload replays the instructions before reaching the reload exit.
    }

    async function connectSession() {
      try {
        await jsPsych.multiplayer.connect(adapter(), {
          dropoutTimeout: CONFIG.DROPOUT_TIMEOUT_MS,
          reconnectTimeout: CONFIG.RECONNECT_GIVE_UP_MS,
        });
      } catch (error) {
        console.error("Could not connect to the multiplayer session", error);
        noMatchReason = "connect_error";
        return { connection: noMatchReason };
      }
      try {
        sessionStorage.setItem(CONNECTED_KEY, "1");
      } catch {
        // See `resumed` above.
      }

      participantId = jsPsych.multiplayer.participantId;
      dyadId = jsPsych.multiplayer.sessionId;

      if (jsPsych.multiplayer.restarted) {
        reloaded = true;
        // A tab reloaded at a pair barrier still has its ready flags from before the reload, and
        // is briefly connected again before it leaves; withdraw them so the partner cannot start on
        // them alone.
        try {
          Promise.resolve(
            jsPsych.multiplayer.update({ ready: false, ready_for_main: false }, { scope: "session" }),
          ).catch(() => {});
        } catch {
          // The partner's barrier still requires this participant to stay connected.
        }
        return { connection: "restarted" };
      }

      const ids = SHAPES.map((s) => s.id);
      const shuffle = (key, array) => jsPsych.multiplayer.shuffle(key, array);
      try {
        // Both partners draw the same main and practice targets from the session's shared
        // randomness; practice targets are the tangrams the main schedule leaves out.
        const phases = Hawkins.phaseSchedules(
          Hawkins.sequentialSchedule(CONFIG.BLOCKS, ids, shuffle, CONFIG.TARGETS_PER_BLOCK),
          ids,
          CONFIG.PRACTICE_ROUNDS,
          shuffle,
        );
        SCHEDULE = phases.main;
        PRACTICE_SCHEDULE = phases.practice;
      } catch (error) {
        // A misconfigured schedule (e.g. more practice rounds than unassigned tangrams).
        console.error("Could not build the trial schedule", error);
        noMatchReason = "schedule_error";
        return { connection: "connected", schedule_error: String(error?.message ?? error) };
      }
      // jsPsych reads a timeline's timeline_variables when that timeline starts, so setting them
      // here, before the loops are reached, takes effect.
      gameLoop.timeline_variables = SCHEDULE;
      practiceLoop.timeline_variables = PRACTICE_SCHEDULE;
      jsPsych.data.addProperties({
        config_trials: SCHEDULE.length,
        assigned_target_ids: SCHEDULE.slice(0, CONFIG.TARGETS_PER_BLOCK).map((trial) => trial.targets[0]).sort(),
        practice_target_ids: PRACTICE_SCHEDULE.map((trial) => trial.targets[0]),
      });
      return { connection: "connected" };
    }

    // Connects only after the instructions and quiz, so the lobby pairs participants who are ready
    // to play and nobody's pairing timeout runs while their partner is still reading.
    const connectTrial = {
      type: jsPsychCallFunction,
      async: true,
      func: (done) => {
        jsPsych.getDisplayElement().innerHTML = "<p>Connecting…</p>";
        connectSession().then(done);
      },
    };

    // ---- Start ----------------------------------------------------------------------------------

    async function start() {
      const params = studyLinkParams();
      prolific = {
        pid: params.get("PROLIFIC_PID"),
        study: params.get("STUDY_ID"),
        session: params.get("SESSION_ID"),
      };
      jsPsych.data.addProperties({
        prolific_pid: prolific.pid,
        study_id: prolific.study,
        session_id: prolific.session,
      });

      await jsPsych.run([
        preloadTrial,
        ...(resumed ? [] : [generalInstructions, comprehensionLoop]),
        connectTrial,
        waitingRoom,
        pairingPhase,
        roleRecap,
        interfaceWalkthrough,
        readyBarrier,
        practiceLoop,
        mainTransition,
        mainReadyBarrier,
        gameLoop,
        terminalScreen,
      ]);
    }

    if (onJatos) jatos.onLoad(start);
    else start();
  </script>
</html>
