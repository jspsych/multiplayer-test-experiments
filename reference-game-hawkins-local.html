<!DOCTYPE html>
<html>
  <head>
    <title>Reference Game — Hawkins et al. 2020 replication (sequential) — local build</title>
    <!-- ===============================================================================================
         FULLY LOCAL / OFFLINE variant of reference-game-hawkins.html. Identical timeline and parameters —
         only the <script>/<link> sources differ: everything is loaded from ./vendor/ instead of a CDN.

         Why this file exists: @jspsych-multiplayer/plugin-multiplayer-reference-game is not published to
         npm yet, so the CDN tag in reference-game-hawkins.html 404s and that file cannot run at all today.

         vendor/ contents and where they came from:
           jspsych.js, jspsych.css               jsPsych core, SHA-pinned #3694 preview build
                                                 (151ab520542a8e48bcc4d5b21c74cdffae8b48c6) — the
                                                 multiplayer API is not in a released jspsych yet.
           plugin-survey-text.js                 @jspsych/plugin-survey-text 2.1.1 (unpkg)
           plugin-html-keyboard-response.js      @jspsych/plugin-html-keyboard-response 2.2.0 (unpkg)
           plugin-preload.js                     @jspsych/plugin-preload 2.1.0 (unpkg)
           adapter-multiplayer-local.js          built from ../jspsych-multiplayer (npm run build -w …)
           plugin-multiplayer-sync.js            ditto
           plugin-multiplayer-role.js            ditto
           plugin-multiplayer-reference-game.js  ditto

         REFRESHING the four multiplayer bundles after changing plugin source:
           cd ../jspsych-multiplayer
           for p in adapter-multiplayer-local plugin-multiplayer-sync plugin-multiplayer-role \
                    plugin-multiplayer-reference-game; do npm run build -w packages/$p; done
           for p in adapter-multiplayer-local plugin-multiplayer-sync plugin-multiplayer-role \
                    plugin-multiplayer-reference-game; do
             cp packages/$p/dist/index.browser.min.js ../multiplayer-test-experiments/vendor/$p.js
           done
         A stale vendor/ silently reproduces bugs already fixed in source — rebuild when unsure.

         Still needs a static server (the local adapter and the PNGs need http(s), not file://):
           npx serve .   →   open reference-game-hawkins-local.html, then paste the full URL
           (including ?mp_session=…) into a second tab to join as the second player.

         Once the plugin publishes, reference-game-hawkins.html is the file to run and this one can go.
         =============================================================================================== -->
    <script src="vendor/jspsych.js"></script>
    <script src="vendor/plugin-survey-text.js"></script>
    <script src="vendor/plugin-html-keyboard-response.js"></script>
    <script src="vendor/plugin-preload.js"></script>
    <!-- STUDY PROTOTYPE: on the LOCAL adapter for two-tab piloting on one machine. For the paid Prolific
         run, swap adapter-multiplayer-local → adapter-multiplayer-firebase (and pair via a real waiting
         room); nothing else in this file changes. -->
    <script src="vendor/adapter-multiplayer-local.js"></script>
    <script src="vendor/plugin-multiplayer-sync.js"></script>
    <script src="vendor/plugin-multiplayer-role.js"></script>
    <script src="vendor/plugin-multiplayer-reference-game.js"></script>
    <script src="tangrams.js"></script>
    <link rel="stylesheet" href="vendor/jspsych.css" />
    <style>
      /* STIMULUS GEOMETRY — reproduced from hawkrobe/tangrams `tangrams_sequential` (the "cued"
         version), OSF osf.io/vzvmf.
         Original: game.core.js lays out a 6×2 grid of SQUARE 300×300px cells, and
         stimuli/objectSet.js gives every tangram an explicit draw size that is exactly 0.7× its
         natural PNG size — e.g. A 403×393 → 282.1×275.1, J 253×356 → 151.8×249.2. Each image is
         centred in its cell at that size.

         The consequence, and it is deliberate in the original: the tangrams are NOT normalised to a
         common size. One uniform scale factor is applied to all twelve, so their relative sizes are
         preserved — J really is drawn smaller than C. Fitting each image to its box instead would
         change those ratios and hand participants a size cue the original never had.

         So each width below is `originalDrawWidth / 300`, expressed as a percentage of the cell's
         content box — which makes the content box play the part of the original's 300px cell and
         keeps the geometry exact at any `cell_size`. Heights follow from the aspect ratio and all
         stay under 100% (tallest is L at 93.6%). */
      .jspsych-multiplayer-reference-game .jspsych-multiplayer-reference-game-cell {
        aspect-ratio: 1 / 1; /* the original's square 300×300 cell */
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .jspsych-multiplayer-reference-game .jspsych-multiplayer-reference-game-cell-content {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .jspsych-multiplayer-reference-game .jspsych-multiplayer-reference-game-cell-content img {
        width: auto;
        height: auto;
        max-width: none;
        max-height: none;
      }
      /* originalDrawWidth / 300, per stimuli/objectSet.js */
      .jspsych-multiplayer-reference-game img[src$="tangram_A.png"] { width: 94.03%; }
      .jspsych-multiplayer-reference-game img[src$="tangram_B.png"] { width: 78.40%; }
      .jspsych-multiplayer-reference-game img[src$="tangram_C.png"] { width: 97.77%; }
      .jspsych-multiplayer-reference-game img[src$="tangram_D.png"] { width: 63.00%; }
      .jspsych-multiplayer-reference-game img[src$="tangram_E.png"] { width: 68.17%; }
      .jspsych-multiplayer-reference-game img[src$="tangram_F.png"] { width: 87.27%; }
      .jspsych-multiplayer-reference-game img[src$="tangram_G.png"] { width: 94.97%; }
      .jspsych-multiplayer-reference-game img[src$="tangram_H.png"] { width: 58.33%; }
      .jspsych-multiplayer-reference-game img[src$="tangram_I.png"] { width: 74.17%; }
      .jspsych-multiplayer-reference-game img[src$="tangram_J.png"] { width: 50.60%; }
      .jspsych-multiplayer-reference-game img[src$="tangram_K.png"] { width: 61.60%; }
      .jspsych-multiplayer-reference-game img[src$="tangram_L.png"] { width: 60.90%; }

      /* The original highlights the feedback cell GREEN regardless of correctness — it never draws a
         "wrong" colour, and the score counter is the only channel carrying the outcome. The plugin
         colours the matcher's choice red when it missed, so repaint that to match. Doubled-up
         selectors to outrank the plugin's own (later-injected) stylesheet. */
      .jspsych-multiplayer-reference-game .jspsych-multiplayer-reference-game-cell.is-wrong {
        border-color: #2b8a3e;
        box-shadow: 0 0 0 2px rgba(43, 138, 62, 0.35);
      }
      .jspsych-multiplayer-reference-game .jspsych-multiplayer-reference-game-mark.is-wrong {
        background: #2b8a3e;
      }

      /* "Partner is typing…" hint. The original has one too (sharedUtils/clientBase.js sends
         `playerTyping.true/false` and renders "Other player is typing..." in the message log). */
      .jspsych-multiplayer-reference-game .typing-hint {
        min-height: 1.2em;
        margin-bottom: 0.3em;
        font-size: 0.9em;
        font-style: italic;
        color: #555;
        text-align: left;
      }
      .jspsych-multiplayer-reference-game .typing-hint[hidden] {
        display: block;
        visibility: hidden;
      }
    </style>
  </head>

  <body></body>
  <script>
    // ===============================================================================================
    // REFERENCE GAME — replication of Hawkins, Frank & Goodman (2020), "Characterizing the Dynamics of
    // Learning in Repeated Reference Games" (Cognitive Science 44, e12845); the "sequential" condition.
    //
    // Faithful design (from the paper + github.com/hawkrobe/tangrams):
    //   • 12 tangrams (the canonical set, shared with Clark & Wilkes-Gibbs 1986), in a 6×2 grid,
    //     independently scrambled per player each trial (can't point by position).
    //   • SINGLE target per trial; the matcher clicks the one tangram they think the director means.
    //   • 6 repetition blocks × 12 trials = 72 trials; each tangram is the target once per block.
    //   • Director/matcher roles fixed for the whole game.
    //   • "Cued" version: only the director sees which tangram is the target (reveal_target_to).
    //   • Free text chat, UNRESTRICTED both ways (both may send, no count/length limit) — the paper's
    //     exact channel, and what makes the reference-shortening effect possible.
    //   • Full immediate feedback to both: the director sees the matcher's click, the matcher sees the
    //     intended tangram.
    //   • The matcher cannot click until the director has sent a message that round
    //     (require_message_before_response), so a referring expression exists on every trial and the
    //     matcher can't blind-guess to rush through — verified in hawkrobe/tangrams game.client.js,
    //     where the click handler is gated behind `if (globalGame.messageSent)`.
    //
    // Re-audited line by line against the original source (OSF osf.io/vzvmf → github component =
    // hawkrobe/tangrams, `experiments/tangrams_sequential`, i.e. the "cued" version — the README
    // there defines cued as "a sequential version that cues each target in a sequence of trials").
    // Confirmed identical: 2 players; fixed director/matcher; 6×2 grid of SQUARE cells; 72 rounds as
    // 6 shuffled blocks of 12 (game.core.js `getRandomizedConditions`); layouts re-randomised every
    // round, independently per player; target revealed to the director only; unrestricted two-way
    // chat; per-round chat log; the matcher-click gate (`globalGame.messageSent`); 3000ms of
    // feedback before the next round (game.server.js `setTimeout(..., 3000)`); a typing indicator
    // (sharedUtils/clientBase.js `playerTyping`); and a persistent round counter + running score.
    //
    // Position disjointness and per-role feedback were gaps until the plugin gained
    // `scramble_mode: "disjoint"` and role-keyed `feedback_content`; both are now used below, and
    // the always-green feedback highlight is restored in CSS. ONE known difference remains:
    //   Gate semantics. The original sets `messageSent` in its `chatMessage` handler, which fires
    //      for ANY message including the matcher's own — so a matcher could unlock their own click by
    //      typing anything. The plugin counts only the PARTNER's message. Ours is the stricter (and,
    //      judging by the source comment, the intended) reading.
    //
    // The remaining departure is not a design choice: `round_timeout` (60s) has no counterpart in the
    // original, which ran
    // untimed. It exists so a disconnected or absent partner cannot hang the trial forever. Rounds it
    // ends are recorded as `ended_by: "timeout"` with a null assignment — filter on that when
    // analysing, and raise it if piloting shows real trials running long.
    //
    // Key replication DVs (logged per round): message_count / messages_sent (words-per-reference proxy),
    // accuracy / correct, rt. Expected: descriptions shorten strongly across blocks; accuracy near
    // ceiling by the final block.
    // ===============================================================================================

    const MIN_PLAYERS = 2;
    // Faithful is 6. Lower this (e.g. 1–2) for a quick two-tab smoke test, then restore to 6.
    const BLOCKS = 6;

    const jsPsych = initJsPsych();
    const localAdapter = new jsPsychAdapterMultiplayerLocal({ persistParticipant: true });

    const SHAPES = Tangrams.STIMULI; // 12 canonical tangrams (ids A–L, image src)
    // Seed the schedule from the SHARED SESSION ID, so each dyad gets its own trial order while the
    // two partners still agree on it. A fixed seed would hand every dyad the identical order, which
    // confounds item order with repetition block — the very axis this study measures.
    //
    // Read AFTER the adapter is constructed, deliberately: on the first tab there is no `?mp_session=`
    // yet, and the LocalAdapter constructor is what generates one and writes it into the URL. The
    // second tab arrives with it already in the pasted link, so both compute the same schedule.
    // Swapping to the Firebase adapter: seed from whatever identifies the dyad there (e.g. the room
    // id) — the requirement is only that both partners derive the same value.
    const SEED = new URLSearchParams(location.search).get("mp_session") ?? "hawkins-sequential";
    // 72 rounds: 6 blocks × 12, each tangram once per block. Deterministic given the seed, so both
    // tabs agree without exchanging anything.
    const SCHEDULE = Tangrams.sequentialSchedule(BLOCKS, SEED);

    // The 12 tangrams are real PNGs, and `rt` is a reported DV — without this the first exposure to
    // each image loads mid-trial. `stimuli` is an OBJECT parameter, so jsPsych's automatic media
    // preloading cannot discover the `src` values; they have to be listed explicitly.
    const preloadTrial = {
      type: jsPsychPreload,
      images: SHAPES.map((s) => s.src),
      message: "<p>Loading…</p>",
    };

    let myName = "";
    let myRole;
    let partnerId;

    const nameTrial = {
      type: jsPsychSurveyText,
      questions: [{ prompt: "Choose a display name:", required: true, name: "name" }],
      on_finish: (data) => {
        myName = (data.response.name || "").trim() || "Anonymous";
      },
    };

    const lobbyTrial = {
      type: jsPsychMultiplayerSync,
      push_data: () => ({ name: myName, joinedAt: Date.now() }),
      message: `<p>Waiting for ${MIN_PLAYERS} players to join…</p>
                <p>Open this page in another tab (keep the <code>?mp_session=</code> in the URL) to add a player.</p>`,
      wait_for: (group) =>
        Object.values(group).filter((entry) => entry && entry.name).length >= MIN_PLAYERS,
    };

    // Fixed director/matcher for the whole game, assigned by deterministic consensus (shared seed from
    // the sorted participant ids) — not "whoever joined first". Use "join_order" while testing if you
    // want the first tab to always be the director.
    const roleTrial = {
      type: jsPsychMultiplayerRole,
      roles: ["director", "matcher"],
      strategy: "random",
      overflow_role: "spectator",
      ready: (group) =>
        Object.keys(group).length >= MIN_PLAYERS &&
        Object.values(group).every((entry) => entry && entry.joinedAt != null),
      save_group: true,
      message: "<p>Pairing you with your partner…</p>",
      on_finish: () => {
        myRole = jsPsychMultiplayerRole.getMyRole();
        const byRole = jsPsychMultiplayerRole.participantsByRole();
        partnerId = myRole === "director" ? byRole.matcher?.[0] : byRole.director?.[0];
      },
    };

    const spectatorScreen = {
      timeline: [
        {
          type: jsPsychHtmlKeyboardResponse,
          stimulus: "<p>This game is already full. Thanks for your interest!</p>",
          choices: "NO_KEYS",
          trial_duration: 4000,
          on_finish: () => jsPsych.multiplayer.disconnect(),
        },
      ],
      conditional_function: () => myRole === "spectator",
    };

    // =============================================================================================
    // "Partner is typing…" indicator.
    //
    // The reference-game plugin has no typing indicator, so this is bolted on from the experiment
    // using the multiplayer API directly — no plugin fork. It reads/writes ONE extra key in this
    // participant's session slot, `typing_at` (a timestamp, or null), and renders the partner's.
    //
    // Why it is safe to write into the same slot the plugin writes:
    //   `push` REPLACES the whole slot, so every writer must read-modify-write. JS is single
    //   threaded and each read+push below happens in ONE synchronous block, so the plugin's chat and
    //   submit pushes can never interleave between this read and this push — no lost message. The
    //   only writer of my slot is my own tab.
    //
    // Rationale for the two constants: the TTL must exceed the throttle, or the hint blinks off
    // between a continuously-typing partner's pushes.
    //
    // The original has this feature (sharedUtils/clientBase.js `playerTyping`), and it matters with
    // the click gate on: the matcher sits blocked until the director's first message, and this is
    // what distinguishes "they're composing a description" from "they've gone away".
    // =============================================================================================
    const TYPING_TTL = 2500; // hide the hint this long after the partner's last keystroke
    const TYPING_THROTTLE = 800; // push at most one typing ping per this many ms

    // Torn down at the end of every round by `stopTypingIndicator`; the plugin rebuilds the whole
    // display each trial, so the hint element and its listeners must be re-created per round too.
    let typingTeardown = null;

    function startTypingIndicator() {
      const api = jsPsych.multiplayer;
      const me = api.participantId;
      const chat = document.querySelector(".jspsych-multiplayer-reference-game-chat");
      const form = document.querySelector(".jspsych-multiplayer-reference-game-chat-form");
      const input = document.querySelector(".jspsych-multiplayer-reference-game-chat-input");
      if (!chat || !form || !input) return; // chat disabled — nothing to attach to

      const hint = document.createElement("div");
      hint.className = "typing-hint";
      hint.setAttribute("role", "status");
      hint.setAttribute("aria-live", "polite");
      hint.textContent = `${myRole === "director" ? "Matcher" : "Director"} is typing…`;
      hint.hidden = true;
      chat.insertBefore(hint, form);

      // Read-modify-write, synchronously — see the header note.
      const mark = (ts) => {
        const mine = api.get(me) ?? {};
        api.push({ ...mine, typing_at: ts }).catch(() => {});
      };

      let lastPush = 0;
      const onInput = () => {
        if (input.value.trim() === "") {
          lastPush = 0;
          mark(null); // cleared the box — stop signalling immediately
          return;
        }
        const now = Date.now();
        if (now - lastPush < TYPING_THROTTLE) return;
        lastPush = now;
        mark(now);
      };
      // Runs AFTER the plugin's own submit handler (added first, in trial()), so by the time this
      // reads the slot the sent message is already in it.
      const onSend = () => {
        lastPush = 0;
        mark(null);
      };

      const render = () => {
        const at = partnerId ? api.getAll()?.[partnerId]?.typing_at : null;
        hint.hidden = !(typeof at === "number" && Date.now() - at < TYPING_TTL);
      };

      input.addEventListener("input", onInput);
      form.addEventListener("submit", onSend);
      const unsubscribe = api.subscribe(render);
      // subscribe only fires on CHANGES; a partner who stops typing pushes nothing more, so the hint
      // needs a clock of its own to expire.
      const ticker = setInterval(render, 500);
      render();

      typingTeardown = () => {
        input.removeEventListener("input", onInput);
        form.removeEventListener("submit", onSend);
        unsubscribe();
        clearInterval(ticker);
        mark(null); // never leave a stale "typing" flag for the next round
      };
    }

    function stopTypingIndicator() {
      typingTeardown?.();
      typingTeardown = null;
    }

    const gameRound = {
      type: jsPsychMultiplayerReferenceGame,
      stimuli: SHAPES,
      columns: 6, // 6×2 grid, as in the original
      cell_size: 130, // square cells, as in the original's 300px ones (see the <style> block)
      role: () => jsPsychMultiplayerRole.getMyRole(),
      partner_id: () => partnerId,
      round: jsPsych.timelineVariable("round"),
      targets: jsPsych.timelineVariable("targets"), // length 1 → single click (sequential)
      // "disjoint", not "independent": the original re-rolls the two layouts until NO tangram sits
      // in the same cell for both players (game.core.js `notMatchingLocs`/`arraysDifferent`). Plain
      // independent only guarantees the layouts differ, leaving ~1/e of tangrams sharing a cell by
      // chance — enough for "the one in the corner" to work by luck now and then.
      scramble_mode: "disjoint",
      reveal_target_to: "director", // "cued": only the director sees the target
      // Unrestricted free chat, both directions — the paper's exact channel (these are the defaults,
      // stated explicitly here because they are load-bearing for the effect).
      chat_role: "both",
      max_messages: null,
      max_length: null,
      // Exp. 2's click gate: no selection until the director has described the target this round.
      // Guarantees a referring expression per trial and blocks blind-guessing.
      require_message_before_response: true,
      // The original shows the round counter and the running score PERSISTENTLY, above the board
      // ("Round 5 of 72" / "Number correct: 3" — game.client.js `newRoundUpdate`), not as part of
      // per-trial feedback. So the counter moves into `prompt` (below) and this stays off.
      show_running_score: false,
      // Original feedback (game.client.js 's.feedback'): ONE green highlight per role and nothing
      // else — the director sees the object the matcher clicked, the matcher sees the true target,
      // and there is no "Correct!/Incorrect." line (correctness reaches players only through the
      // persistent score counter above). Expressed with the plugin's role-keyed feedback_content.
      feedback_content: {
        director: { reveal_target: false, show_score: false, show_partner_choice: true },
        matcher: { reveal_target: true, show_score: false, show_partner_choice: false },
      },
      round_timeout: 60000, // NOT in the original — bounds the round if the partner leaves (see header)
      save_interaction_history: true,
      // Instruction wording taken from the original (game.client.js `client_onjoingame`). The one
      // edit: the original tells BOTH roles they may "talk to the director", plainly a copy-paste
      // slip in the source, so the matcher's copy names the director and the director's the matcher.
      // The round counter and score line reproduce the original's persistent #roundnumber/#score.
      prompt: (role) => {
        const finished = jsPsych.data.get().filter({ trial_type: "multiplayer-reference-game" });
        const score = finished.filter({ correct: true }).count();
        // Counted from finished rounds rather than read from the timeline variable, so it needs no
        // timeline-context API and still matches the original, whose roundNum advances on every
        // round regardless of outcome.
        const roundNum = finished.count() + 1;
        const header = `<p>Round ${roundNum} of ${SCHEDULE.length} &nbsp;|&nbsp; Number correct: ${score}</p>`;
        // Kept on single lines on purpose: a line break inside a template literal is a real newline
        // in the rendered string.
        const director =
          "Send messages to help the matcher pick the target image." +
          " You are free to use the chatbox to talk to the matcher at any time.";
        const matcher =
          "Select the correct target out of the lineup." +
          " You are free to use the chatbox to talk to the director at any time.";
        return role === "director"
          ? `${header}<p><strong>You are the Director.</strong> ${director}</p>`
          : `${header}<p><strong>You are the Matcher.</strong> ${matcher}</p>`;
      },
      // The original has a typing indicator too (sharedUtils/clientBase.js: `playerTyping.true` on
      // input, `.false` when the box is emptied, rendered as "Other player is typing...").
      on_load: startTypingIndicator,
      on_finish: stopTypingIndicator,
    };

    const gameLoop = {
      timeline: [gameRound],
      timeline_variables: SCHEDULE,
      conditional_function: () => myRole === "director" || myRole === "matcher",
    };

    const doneTrial = {
      type: jsPsychHtmlKeyboardResponse,
      stimulus: () => {
        const completed = jsPsych.data
          .get()
          .filter({ trial_type: "multiplayer-reference-game", ended_by: "submit" });
        const played = completed.count();
        const correct = completed.filter({ correct: true }).count();
        return `<h2>Game complete!</h2>
                <p>Together you got <strong>${correct} of ${played}</strong> round${
          played === 1 ? "" : "s"
        } correct.</p>
                <p>You may close this tab. <button id="dl">Download data (JSON)</button></p>`;
      },
      choices: "NO_KEYS",
      on_load: () => {
        document
          .getElementById("dl")
          ?.addEventListener("click", () =>
            jsPsych.data.get().localSave("json", "reference-game-hawkins-data.json")
          );
      },
    };

    jsPsych.multiplayer.connect(localAdapter).then(() => {
      // Preload FIRST, before pairing: a participant who is still fetching images while their
      // partner waits in the lobby wastes the partner's time.
      jsPsych.run([
        preloadTrial,
        nameTrial,
        lobbyTrial,
        roleTrial,
        spectatorScreen,
        gameLoop,
        doneTrial,
      ]);
    });
  </script>
</html>
